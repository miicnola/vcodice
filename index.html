  --accent:#e0707f; --accent-soft:#3a1b22; --gold:#d8b25a; --gold-soft:#3a3018; --fan:#86b8c4; --fan-soft:#1c3036; --sky1:#0f0d16; --sky2:#2a1b26; --moon:#d9cfae; --hill:#07060a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;max-width:1400px;margin:0 auto}
.brand{font-family:var(--f-display);font-size:1.6rem;line-height:1;color:var(--accent);margin:0;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
.edpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.edpick .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink);font-weight:700}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.loaded .dot{background:var(--gold)} .chip.fan .dot{background:var(--fan)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
nav.cats{max-width:1400px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.cats button{border:0;background:none;padding:8px 12px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.cats button[aria-current="true"]{color:var(--accent);border-color:var(--accent)}
main{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding-block:20px 60px}
aside.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 130px);align-self:start;max-height:calc(100vh - 150px);overflow:auto;border-right:1px solid var(--line);padding-right:12px}
aside.idx h3{font:500 .72rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
aside.idx button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--ink)}
aside.idx button:hover{background:var(--accent-soft)}
aside.idx button[aria-current="true"]{background:var(--accent);color:var(--panel)}
aside.idx button .n{font:400 .75rem var(--f-mono);opacity:.7}
.idxsel{display:none}
.content{min-width:0}
.ghead h2{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;text-wrap:balance;line-height:1.1}
.ghead p{color:var(--muted);margin:6px 0 0;max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin:14px 0 6px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.subhead{font:500 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
article.entry{border-top:1px solid var(--line);padding:16px 0}
.etitle{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.etitle h4{margin:0;font-size:1.18rem;font-weight:700}
.dots{font-family:var(--f-mono);color:var(--accent);letter-spacing:1px;font-size:.95rem;white-space:nowrap}
.etag{font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--fan-soft);color:var(--fan);white-space:nowrap}
.etag.ofi{background:var(--gold-soft);color:var(--gold)}
.etag.diff{background:var(--accent-soft);color:var(--accent)}
.cols{display:grid;gap:12px;margin-top:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.col{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}
.col.mine{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.col.none{background:transparent;border-style:dashed;color:var(--muted)}
.col .ed{font:500 .72rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.col.mine .ed{color:var(--gold)}
.col .roll{font-family:var(--f-mono);font-size:.8rem;background:var(--bg);border-radius:4px;padding:4px 7px;margin:6px 0;color:var(--ink)}
.col p{margin:6px 0 0}
.col .same{color:var(--muted);font-style:italic}
.col .ref{font:400 .75rem var(--f-mono);color:var(--muted);margin-top:8px}
.col .src{font-size:.75rem;color:var(--fan)}
ol.hier{list-style:none;padding:0;margin:8px 0 0;font-size:.9rem;counter-reset:none}
ol.hier li{display:grid;grid-template-columns:2.2em 1fr;gap:6px;padding:3px 0;border-top:1px dotted var(--line)}
ol.hier li b{font-family:var(--f-mono);font-weight:500;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
ol.hier li.chg span{background:var(--accent-soft);border-radius:3px;padding:0 3px}
.empty{color:var(--muted);padding:40px 0}
.eds{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:12px}
.edcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.edcard h5{margin:0 0 4px;font-size:1rem}
.edcard .st{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.edcard ul{margin:8px 0 0;padding-left:18px;font-size:.9rem}
mark{background:var(--gold-soft);color:inherit;border-radius:2px}
@media (max-width:820px){
  header.top{position:static}
  main{grid-template-columns:minmax(0,1fr)}
  aside.idx{display:none}
  .idxsel{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);margin-bottom:12px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .brand{font-size:1.35rem}
  .nocturne .ghead h2{font-size:1.5rem}
  .nocturne .ghead p{font-size:.92rem}
  .sigil{width:44px;height:44px}.sigil svg{width:26px;height:26px}
  .whisper{font-size:.9rem}
}

/* ---- Ornamentos ---- */
.brandrow{display:flex;gap:10px;align-items:center}
.brandrow .seal{width:42px;height:42px;flex:none;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.brandrow .seal svg{width:34px;height:34px}
.nocturne{position:relative;margin:0 0 18px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));min-height:118px;display:flex;align-items:flex-end}
.nocturne svg.scene{position:absolute;inset:0;width:100%;height:100%}
.nocturne .ghead{position:relative;padding:14px 16px 12px;width:100%;display:flex;gap:14px;align-items:flex-end}
.nocturne .ghead h2{color:var(--sky-ink)}
.nocturne .ghead p{color:var(--sky-muted)}
.sigil{width:56px;height:56px;flex:none;border-radius:50%;background:var(--panel);border:2px solid var(--gold);display:grid;place-items:center;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sigil svg{width:32px;height:32px}
.whisper{font-family:var(--f-display);font-size:1rem;color:var(--muted);margin:12px 0 4px;display:flex;gap:10px;align-items:center}
.whisper::before,.whisper::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.whisper span{max-width:60ch;text-align:center;font-style:italic}
.subhead::before{content:"❧ ";color:var(--gold)}
nav.cats button svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.entry .etitle h4::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);opacity:.55;vertical-align:middle}
.fin{display:flex;justify-content:center;margin:26px 0 0;color:var(--gold);opacity:.8}
.fin svg{width:120px;height:24px}
.edcard{position:relative;padding-right:48px}
.edcard .wax{position:absolute;right:12px;top:12px;width:30px;height:30px}
@keyframes flit{0%{transform:translate(0,0)}50%{transform:translate(6px,-4px)}100%{transform:translate(0,0)}}
.bat{animation:flit 6s ease-in-out infinite}.bat.b2{animation-duration:8s}
@media (prefers-reduced-motion:reduce){.bat{animation:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

o","title":"La Llamada de Noé","lvl":2,"v":{"eov":{"r":"Carisma + Supervivencia (dif. 6)","t":"Llama a los animales de un tipo dentro del alcance de su oído. Los éxitos fijan cuántos acuden (1: uno; 2: un cuarto; 3: la mitad; 4: tres cuartos; 5: todos). Un fracaso atrae una parte que llega hostil.","ref":"Edad Oscura: Vampiro, p. 173"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 315"}},"o":0},{"id":"e3","cat":"Disciplinas","group":"Animalismo","title":"Intimidación de la Bestia","lvl":3,"v":{"eov":{"r":"Manipulación + Intimidación (o + Empatía: Canción de la Serenidad), dif. 7, extendida","t":"Hay que acumular éxitos iguales a la Fuerza de Voluntad del blanco y no se puede hacer otra cosa mientras. El mortal o animal intimidado queda tan acobardado que no opone resistencia. El fracaso deja la Bestia del blanco fuera de su alcance para siempre.","ref":"Edad Oscura: Vampiro, p. 173"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 316"}},"o":0},{"id":"e4","cat":"Disciplinas","group":"Animalismo","title":"Cabalgar la Mente Salvaje","lvl":4,"v":{"eov":{"r":"Carisma + Trato con Animales (dif. 8), mirando a los ojos un turno","t":"Posee el cuerpo de un animal vivo con ojos (no demonios ni fantasmas). 1 éxito: control sin Disciplinas; con más éxitos puede usar sus Disciplinas (2: Auspex; 3: Presencia; y así según la tabla). Un fracaso obliga a resistir el Rötschreck.","ref":"Edad Oscura: Vampiro, p. 174"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 317"}},"o":0},{"id":"e5","cat":"Disciplinas","group":"Animalismo","title":"Transmitir a la Bestia","lvl":5,"v":{"eov":{"r":"Manipulación + Trato con Animales (dif. 8), mínimo 2 éxitos","t":"Solo estando en frenesí o a punto de entrar. Traspasa su frenesí a un blanco a la vista, que lo sufre en su lugar. Si se separan antes de que termine, el vampiro puede perder su Bestia y quedar letárgico.","ref":"Edad Oscura: Vampiro, p. 175"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 318"}},"o":0},{"id":"e6","cat":"Disciplinas","group":"Animalismo","title":"Calmar al Rebaño","lvl":6,"v":{"eov":{"r":"Fuerza + Intimidación (dif. 7), extendida","t":"Aplica Intimidación de la Bestia a la vez a todos los blancos cuya FV temporal se supere con los éxitos acumulados. Un fracaso libera a todos y los manda en frenesí contra el vampiro.","ref":"Edad Oscura: Vampiro, p. 175"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 319"}},"o":0},{"id":"e7","cat":"Disciplinas","group":"Auspex","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Sentidos sobrenaturales: percepción, auras, psicometría, lectura mental y proyección astral.","ref":"Edad Oscura: Vampiro, p. 175"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 323"}},"o":0},{"id":"e8","cat":"Disciplinas","group":"Auspex","title":"Sentidos Aguzados","lvl":1,"v":{"eov":{"r":"Acción libre, sin tirada","t":"Dobla el alcance de los sentidos. Mientras está activo, resta su nivel de Auspex a la dificultad de las tiradas de percepción. Un estímulo fuerte (luz, ruido) puede cegarlo o ensordecerlo hasta una hora. Puede dar premoniciones a criterio del Narrador.","ref":"Edad Oscura: Vampiro, p. 176"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 323"}},"o":0},{"id":"e9","cat":"Disciplinas","group":"Auspex","title":"Visión del Alma","lvl":2,"v":{"eov":{"r":"Percepción + Empatía (dif. 8)","t":"Lee el aura. 1 éxito: si es pálida o brillante; 2: el color básico; 3: los patrones; 4: los cambios sutiles; 5: las mezclas. Hace falta un éxito más si el blanco está entre una multitud o tapado. Revela vampiros (aura pálida) y diabolistas (vetas negras).","ref":"Edad Oscura: Vampiro, p. 177"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 324"}},"o":0},{"id":"e10","cat":"Disciplinas","group":"Auspex","title":"El Toque del Espíritu","lvl":3,"v":{"eov":{"r":"Percepción + Empatía (dif. 4-9 según la intensidad de la impresión)","t":"Psicometría: lee las impresiones que deja en un objeto quien lo tocó. Los éxitos determinan cuánto detalle. Un fracaso lo deja abrumado y sin poder actuar 30 minutos.","ref":"Edad Oscura: Vampiro, p. 177"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 325"}},"o":0},{"id":"e11","cat":"Disciplinas","group":"Auspex","title":"Robo de Secretos","lvl":4,"v":{"eov":{"r":"Inteligencia + Subterfugio (dif. = FV actual del blanco); +1 FV contra Cainitas","t":"Telepatía: cada éxito extrae un pensamiento; cada capa más profunda (actitudes, recuerdos, secretos) cuesta un éxito más. Para leer a un vampiro hay que gastar además 1 punto de FV.","ref":"Edad Oscura: Vampiro, p. 178"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 326"}},"o":0},{"id":"e12","cat":"Disciplinas","group":"Auspex","title":"Viaje del Ánima","lvl":5,"v":{"eov":{"r":"1 FV; Percepción + Ocultismo (dif. 7 ±distancia)","t":"Proyección astral, unida al cuerpo por un cordón de plata. Hacen falta 3 éxitos para un viaje sin incidentes. Con un fallo se gasta otra FV y se repite; con un fracaso el cordón se rompe y el alma queda perdida lejos.","ref":"Edad Oscura: Vampiro, p. 178"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 327"}},"o":0},{"id":"e13","cat":"Disciplinas","group":"Auspex","title":"Visión Lejana","lvl":6,"v":{"eov":{"r":"Percepción + Empatía (dif. 6; 8 si solo lo visitó en viaje astral)","t":"Espía a un objetivo conocido a cualquier distancia. Con 2+ éxitos puede usar sobre él el resto de su Auspex. Solo quien tenga Auspex 6+ puede notarlo (Percepción + Ocultismo, dif. 9).","ref":"Edad Oscura: Vampiro, p. 179"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 329"}},"o":0},{"id":"e14","cat":"Disciplinas","group":"Celeridad","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"1 punto de sangre por acción extra","t":"Cada punto da una acción adicional por turno con la reserva completa. Se paga 1 punto de sangre por acción extra, al inicio del turno y aunque supere el máximo por turno de la generación. No tiene poderes con nombre en este libro.","ref":"Edad Oscura: Vampiro, p. 179"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 335"}},"o":0},{"id":"e15","cat":"Disciplinas","group":"Dementación","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Inflige y percibe la locura. Para aprenderla hay que tener al menos un trastorno.","ref":"Edad Oscura: Vampiro, p. 180"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 345"}},"o":0},{"id":"e16","cat":"Disciplinas","group":"Dementación","title":"Pasión del Íncubo","lvl":1,"v":{"eov":{"r":"Carisma + Empatía (dif. = Camino del blanco; FV si es mortal)","t":"Aviva una emoción que el blanco ya siente. Dura según los éxitos: un turno, una hora, una noche, una semana o un mes. Contra un Cainita, cada éxito añade uno a los éxitos que necesita para no caer en frenesí. Un fracaso vuelve la emoción contra el usuario, triplicada, durante una escena.","ref":"Edad Oscura: Vampiro, p. 180"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 346"}},"o":0},{"id":"e17","cat":"Disciplinas","group":"Dementación","title":"Embrujar el Alma","lvl":2,"v":{"eov":{"r":"Manipulación + Empatía (dif. = Percepción + Autocontrol/Instinto del blanco)","t":"Visiones y alucinaciones sacadas del subconsciente del blanco durante una noche, tres noches, una semana, un mes, tres meses o un año (de 1 a 6 éxitos). Con un fallo no se puede repetir hasta la noche siguiente.","ref":"Edad Oscura: Vampiro, p. 181"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 346"}},"o":0},{"id":"e18","cat":"Disciplinas","group":"Dementación","title":"Ojos del Caos","lvl":3,"v":{"eov":{"r":"Percepción + Ocultismo (dif. variable; 8 para un conocido, 10 para un extraño)","t":"Revela la Naturaleza y los trastornos de una persona, o de quien hizo una obra (un éxito más). Con 5+ éxitos da atisbos proféticos. La información es subjetiva y poco fiable.","ref":"Edad Oscura: Vampiro, p. 181"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 347"}},"o":0},{"id":"e19","cat":"Disciplinas","group":"Dementación","title":"Silenciar la Mente Cuerda","lvl":4,"v":{"eov":{"r":"Manipulación + Intimidación vs. Percepción + Autocontrol/Instinto del blanco; un turno de conversación y contacto visual","t":"Sume al blanco en confusión durante un turno, una hora, una noche, una semana o un mes. También puede elegir la furia (un estado parecido al frenesí durante un día) o la catatonia (un día entero sin actuar). Un fallo hace inmune al blanco el resto de la escena.","ref":"Edad Oscura: Vampiro, p. 182"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 347"}},"o":0},{"id":"e20","cat":"Disciplinas","group":"Dementación","title":"Locura Aullante","lvl":5,"v":{"eov":{"r":"Manipulación + Intimidación (dif. = FV del blanco); atención completa un turno","t":"Inflige cinco trastornos a elección del usuario, con coherencia onírica, durante un turno, una noche, una semana, un mes o un año. Después pueden quedar episodios traumáticos. Si fracasa, el usuario toma conciencia de su propia locura y sufre la conmoción.","ref":"Edad Oscura: Vampiro, p. 182"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 348"}},"o":0},{"id":"e21","cat":"Disciplinas","group":"Dementación","title":"Beso de la Luna","lvl":6,"v":{"eov":{"r":"Manipulación + Empatía (dif. 6) extendida vs. FV actual del blanco (dif. 6)","t":"Con 2+ éxitos netos impone dos trastornos permanentes. El blanco no puede eliminarlos, solo resistirlos como cualquier trastorno. Bastan para que pueda aprender Dementación.","ref":"Edad Oscura: Vampiro, p. 182"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 349"}},"o":0},{"id":"e22","cat":"Disciplinas","group":"Dominación","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Impone la voluntad del vampiro. Casi todos los poderes exigen contacto visual y que el blanco entienda las órdenes. Solo se domina a vampiros de generación igual o más alta (más débil).","ref":"Edad Oscura: Vampiro, p. 183"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 352"}},"o":0},{"id":"e23","cat":"Disciplinas","group":"Dominación","title":"Observancia de la Palabra Pronunciada","lvl":1,"v":{"eov":{"r":"Manipulación + Intimidación (dif. = FV del blanco)","t":"Una orden de una sola palabra que el blanco cumple al momento. Los éxitos extra hacen que responda más rápido.","ref":"Edad Oscura: Vampiro, p. 183"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 352"}},"o":0},{"id":"e24","cat":"Disciplinas","group":"Dominación","title":"Murmullo de la Falsa Voluntad","lvl":2,"v":{"eov":{"r":"Manipulación + Liderazgo (dif. = FV del blanco)","t":"Implanta una orden de varias frases, también para después. Con menos de 3 éxitos no cumple órdenes absurdas; con 4 las cumple salvo que le pongan en peligro; con 5, casi cualquier cosa. Solo puede revocarla alguien de generación igual o más baja que el dominador original.","ref":"Edad Oscura: Vampiro, p. 183"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 353"}},"o":0},{"id":"e25","cat":"Disciplinas","group":"Dominación","title":"Memoria del Juerguista","lvl":3,"v":{"eov":{"r":"Astucia + Subterfugio (dif. = FV del blanco)","t":"Borra, altera o implanta recuerdos; la profundidad depende de los éxitos. Para restaurar recuerdos manipulados hace falta un nivel de Dominación igual o mayor que el del manipulador (la generación no importa) y superarle en éxitos.","ref":"Edad Oscura: Vampiro, p. 184"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 353"}},"o":0},{"id":"e26","cat":"Disciplinas","group":"Dominación","title":"Tentación de la Sugerencia Sutil","lvl":4,"v":{"eov":{"r":"Carisma + Liderazgo (dif. = FV del blanco), extendida, una tirada por noche","t":"Condiciona al sujeto para que sea leal y obediente. El Narrador fija en secreto los éxitos necesarios (de 5 a 10 veces su Autocontrol). Un fracaso anula el progreso y puede volver al sujeto contra el vampiro.","ref":"Edad Oscura: Vampiro, p. 184"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 354"}},"o":0},{"id":"e27","cat":"Disciplinas","group":"Dominación","title":"Recipiente","lvl":5,"v":{"eov":{"r":"1 FV; Carisma + Intimidación vs. FV (dif. 7); luego Manipulación + Intimidación (dif. 7)","t":"Posesión. Primero hay que vaciar la Fuerza de Voluntad temporal del blanco (cada éxito neto le quita un punto) y después el vampiro proyecta su mente en el cuerpo. Un fracaso hace inmune a la víctima a su Dominación el resto de la historia.","ref":"Edad Oscura: Vampiro, p. 185"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 355"}},"o":0},{"id":"e28","cat":"Disciplinas","group":"Dominación","title":"Fidelidad","lvl":6,"v":{"eov":{"r":"Carisma + Liderazgo (dif. = FV del blanco)","t":"Juramento de lealtad sobrenatural durante una semana, un mes, un año, 10 años o 100 años (de 1 a 5 éxitos).","ref":"Edad Oscura: Vampiro, p. 186"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 357"}},"o":0},{"id":"e29","cat":"Disciplinas","group":"Extinción","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Control de la propia sangre y de la ajena, venenos y silencio.","ref":"Edad Oscura: Vampiro, p. 186"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 359"}},"o":0},{"id":"e30","cat":"Disciplinas","group":"Extinción","title":"Silencio de la Sangre Ardiente","lvl":1,"v":{"eov":{"r":"1 punto de sangre, sin tirada","t":"Zona de silencio absoluto de unos 6 m de radio (o la sala entera), que sigue al vampiro durante una hora. Variante «Maldición del Silencio», con 2 puntos de sangre: deja mudo a un blanco.","ref":"Edad Oscura: Vampiro, p. 187"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 360"}},"o":0},{"id":"e31","cat":"Disciplinas","group":"Extinción","title":"Toque del Escorpión","lvl":2,"v":{"eov":{"r":"Puntos de sangre (máx. Resistencia) + tirada de FV (dif. 6)","t":"Convierte su sangre en veneno, que dura hasta el amanecer. La víctima tira Resistencia (+Fortaleza) y pierde puntos de Resistencia igual a sus éxitos. La duración depende de los éxitos de FV: un turno, una hora, un día, un mes o permanente (se recupera con PX).","ref":"Edad Oscura: Vampiro, p. 187"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 360"}},"o":0},{"id":"e32","cat":"Disciplinas","group":"Extinción","title":"La Llamada de Dagon","lvl":3,"v":{"eov":{"r":"1 FV por turno; Resistencia vs. Resistencia (dif. = FV del rival)","t":"Hay que tocar al blanco antes; durante la hora siguiente se le puede atacar a distancia y sin verlo. Cada éxito es un nivel de daño letal que no se absorbe. Se repite cada turno pagando 1 FV más.","ref":"Edad Oscura: Vampiro, p. 188"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 361"}},"o":0},{"id":"e33","cat":"Disciplinas","group":"Extinción","title":"La Caricia de Baal","lvl":4,"v":{"eov":{"r":"Sin tirada; puntos de sangre untados en un arma","t":"La sangre convertida en veneno espeso vuelve agravado el daño de un arma de filo, una flecha o las garras. Cada impacto acertado consume un punto.","ref":"Edad Oscura: Vampiro, p. 188"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 361"}},"o":0},{"id":"e34","cat":"Disciplinas","group":"Extinción","title":"Esencia de Sangre","lvl":5,"v":{"eov":{"r":"FV (dif. 9) extendida en lugar de la tirada de Fuerza de la diablerie","t":"Destila la esencia de un vampiro como en la diablerie, pero de forma más controlada: cada éxito es un nivel agravado que no se absorbe.","ref":"Edad Oscura: Vampiro, p. 188"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 361"}},"o":0},{"id":"e35","cat":"Disciplinas","group":"Extinción","title":"Ondas del Corazón","lvl":6,"v":{"eov":{"r":"1 FV; Carisma + Empatía (dif. 7; 5 si siente esa emoción)","t":"Infunde una emoción en la sangre de un mortal durante un mes lunar por éxito. Quien beba de él deberá superar una tirada o sentirá esa emoción.","ref":"Edad Oscura: Vampiro, p. 189"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 362"}},"o":0},{"id":"e36","cat":"Disciplinas","group":"Fortaleza","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"Pasiva","t":"Cada punto añade un dado para absorber daño contundente y letal. Permite absorber el agravado: contra sol y fuego se tira Resistencia + Fortaleza; contra el resto (suelo sagrado, garras...), solo Fortaleza. No tiene poderes con nombre en este libro.","ref":"Edad Oscura: Vampiro, p. 189"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 366"}},"o":0},{"id":"e37","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Disciplina de muerte de los Capadocios. En EO:V 2003 tiene tres sendas: la Podredumbre de la Tumba, el Cadáver dentro del Monstruo y la Animación Cadavérica. En VEO21 se integra en Nigromancia.","ref":"Edad Oscura: Vampiro, p. 189"},"veo21":{"r":"Sendas y rituales, como la Taumaturgia","t":"En VEO21 Mortis pasa a llamarse Nigromancia. Reúne las tres sendas de EO:V 2003 (Animación Cadavérica, el Cadáver dentro del Monstruo y la Podredumbre de la Tumba, con el mismo texto) y añade cuatro: los Cuatro Humores (Lamiae), el Embrujo y el Sepulcro (Giovanni) y la Vítrea. También amplía mucho los rituales.","ref":"VEO21, p. 439"}},"o":0},{"id":"e38","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Destruir la Cáscara","lvl":1,"v":{"eov":{"r":"1 punto de sangre; Inteligencia + Medicina (dif. 6)","t":"Reduce un cadáver a polvo en (5 - éxitos) turnos. Ningún medio mundano puede averiguar ya de quién era.","ref":"Edad Oscura: Vampiro, p. 190"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 446"}},"o":0,"sub":"La Podredumbre de la Tumba"},{"id":"e39","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Rigor Mortis","lvl":2,"v":{"eov":{"r":"1 FV; Manipulación + Medicina (dif. 7); a la vista y a menos de 25 m","t":"Paraliza al blanco como si estuviera estacado, un turno por éxito. Puede liberarse con FV (dif. 7, 2 éxitos); si falla, sufre 1 nivel contundente.","ref":"Edad Oscura: Vampiro, p. 190"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 446"}},"o":0,"sub":"La Podredumbre de la Tumba"},{"id":"e40","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Marchitar","lvl":3,"v":{"eov":{"r":"1 FV; toque (Destreza + Pelea si lo esquiva)","t":"Al tocar un miembro, inflige 2 niveles agravados. Si no se absorben ambos, el miembro queda inútil hasta curarlos (un mortal, de por vida).","ref":"Edad Oscura: Vampiro, p. 190"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 447"}},"o":0,"sub":"La Podredumbre de la Tumba"},{"id":"e41","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Corromper la Carne No Muerta","lvl":4,"v":{"eov":{"r":"1 FV; Manipulación + Medicina (dif. 6) vs. Resistencia + Fortaleza (dif. = FV del atacante); hasta 20 m","t":"Contagia una peste a un vampiro: Fuerza y Astucia a la mitad, -1 Destreza, 1 punto de sangre extra para despertar y Autocontrol/Instinto (dif. 8) para no vomitar lo que bebe. Cada puesta de sol tira Resistencia (dif. 11 - noches transcurridas) para sanar.","ref":"Edad Oscura: Vampiro, p. 191"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 447"}},"o":0,"sub":"La Podredumbre de la Tumba"},{"id":"e42","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Disolver la Carne","lvl":5,"v":{"eov":{"r":"2 sangre + 1 FV; FV vs. Resistencia + 3 de la víctima","t":"Rocía al vampiro con vitae cargada: cada éxito es un nivel agravado y la carne afectada se vuelve polvo, que hay que regenerar con esfuerzo.","ref":"Edad Oscura: Vampiro, p. 191"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 448"}},"o":0,"sub":"La Podredumbre de la Tumba"},{"id":"e43","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Máscara de la Muerte","lvl":1,"v":{"eov":{"r":"1 punto de sangre (sobre otro: tocarlo)","t":"Aspecto cadavérico: -2 Destreza y Apariencia, +2 dados a Intimidación. Inmóvil, solo se le distingue de un cadáver con 5 éxitos en Percepción + Medicina (dif. 7).","ref":"Edad Oscura: Vampiro, p. 191"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 443"}},"o":0,"sub":"El Cadáver dentro del Monstruo"},{"id":"e44","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Frío de la Tumba","lvl":2,"v":{"eov":{"r":"1 FV, una escena","t":"Ignora las penalizaciones por heridas. +1 dado para resistir manipulación emocional y -1 dado para manipular a otros. No protege del frenesí.","ref":"Edad Oscura: Vampiro, p. 191"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 443"}},"o":0,"sub":"El Cadáver dentro del Monstruo"},{"id":"e45","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Maldición de la Vida","lvl":3,"v":{"eov":{"r":"1 FV; Inteligencia + Medicina (dif. 8); hasta 20 m","t":"El blanco sufre las molestias de los vivos sin sus ventajas: +2 a la dificultad de todas sus tiradas (puede ignorarlo pagando 1 FV por escena) y no puede usar sangre para subir sus Atributos Físicos.","ref":"Edad Oscura: Vampiro, p. 192"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 444"}},"o":0,"sub":"El Cadáver dentro del Monstruo"},{"id":"e46","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Don del Cadáver","lvl":4,"v":{"eov":{"r":"1 FV; Resistencia + Ocultismo (dif. 8)","t":"Un turno por éxito como un cadáver animado: inmune a la fe, al suelo sagrado, al frenesí y al Rötschreck; el sol solo hace daño contundente leve y el fuego, letal; la estaca no le paraliza.","ref":"Edad Oscura: Vampiro, p. 192"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 444"}},"o":0,"sub":"El Cadáver dentro del Monstruo"},{"id":"e47","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Don de la Vida","lvl":5,"v":{"eov":{"r":"12 puntos de sangre seguidos; Resistencia + Ocultismo (dif. 6)","t":"Recupera temporalmente rasgos de la vida (comer, aguantar el sol de forma limitada, etc.; ver el texto). Un fracaso es catastrófico: puede destruirle o Abrazar sin querer.","ref":"Edad Oscura: Vampiro, p. 192"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 445"}},"o":0,"sub":"El Cadáver dentro del Monstruo"},{"id":"e48","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Rastro de Vida","lvl":1,"v":{"eov":{"r":"Manipulación + Ocultismo (dif. 6)","t":"Hace que un cadáver a menos de 10 m se mueva levemente, respire o tenga pulso. Con 4+ éxitos mantiene esos patrones durante una escena.","ref":"Edad Oscura: Vampiro, p. 193"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 440"}},"o":0,"sub":"Animación Cadavérica"},{"id":"e49","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Invocar al Sirviente Homúnculo","lvl":2,"v":{"eov":{"r":"1 punto de sangre; Destreza + Ocultismo (dif. 7)","t":"Anima un miembro suelto (por ejemplo, una mano) como sirviente obediente, unido a él por telepatía. Un fracaso inutiliza el miembro para siempre.","ref":"Edad Oscura: Vampiro, p. 194"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 441"}},"o":0,"sub":"Animación Cadavérica"},{"id":"e50","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Animar al Sirviente Cadavérico","lvl":3,"v":{"eov":{"r":"1 punto de sangre; Manipulación + Ocultismo (dif. 6); 3 turnos","t":"Un cadáver hace de criado durante 1 día por éxito, con tareas sencillas. Un fracaso lo consume en llamas.","ref":"Edad Oscura: Vampiro, p. 194"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 441"}},"o":0,"sub":"Animación Cadavérica"},{"id":"e51","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Llamar al Athanatos","lvl":4,"v":{"eov":{"r":"2 puntos de sangre; Resistencia + Ocultismo (dif. 8); 5 minutos","t":"Alza un guerrero no muerto (los éxitos extra mejoran su combate). Hay que dominarlo con FV (dif. 7) o atacará a cualquiera.","ref":"Edad Oscura: Vampiro, p. 194"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 441"}},"o":0,"sub":"Animación Cadavérica"},{"id":"e52","cat":"Disciplinas","group":"Mortis/Nigromancia","title":"Convocar al Ejército de Cadáveres","lvl":5,"v":{"eov":{"r":"3 puntos de sangre; Resistencia + Ocultismo (dif. 8); 10 minutos","t":"Cada éxito alza dos guerreros como el Athanatos. Hay que mantener el control de la horda.","ref":"Edad Oscura: Vampiro, p. 195"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 443"}},"o":0,"sub":"Animación Cadavérica"},{"id":"e53","cat":"Disciplinas","group":"Obtenebración","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Invoca y moldea la oscuridad del Abismo: sombras, tinieblas sólidas y tentáculos. Muy ligada a los Lasombra.","ref":"Edad Oscura: Vampiro, p. 197"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 372"}},"o":0},{"id":"e54","cat":"Disciplinas","group":"Obtenebración","title":"Juego de Sombras","lvl":1,"v":{"eov":{"r":"1 punto de sangre, una escena","t":"+1 dado a Intimidación y Sigilo. Permite pequeños trucos con las sombras y reducir la penalización por oscuridad.","ref":"Edad Oscura: Vampiro, p. 197"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 373"}},"o":0},{"id":"e55","cat":"Disciplinas","group":"Obtenebración","title":"Nocturno","lvl":2,"v":{"eov":{"r":"Manipulación + Ocultismo (dif. 7); hasta 50 m (fuera de la vista: +1 sangre y dif. 9)","t":"Nube de oscuridad de 3 m de diámetro (los éxitos extra la duplican). Dentro, -5 dados a Percepción, salvo para quien tenga Obtenebración.","ref":"Edad Oscura: Vampiro, p. 197"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 373"}},"o":0},{"id":"e56","cat":"Disciplinas","group":"Obtenebración","title":"Los Brazos de Ahriman","lvl":3,"v":{"eov":{"r":"1 punto de sangre; Manipulación + Pelea (dif. 7)","t":"Un tentáculo de sombra de 2 m por éxito, con Fuerza y Destreza iguales a su Obtenebración y 4 niveles de salud. Con más sangre se mejoran o alargan. Son vulnerables al fuego y al sol.","ref":"Edad Oscura: Vampiro, p. 198"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 373"}},"o":0},{"id":"e57","cat":"Disciplinas","group":"Obtenebración","title":"Sombras Nocturnas","lvl":4,"v":{"eov":{"r":"Astucia + Ocultismo (dif. 7)","t":"Ilusiones de sombra (una de tamaño humano por éxito; se ven con Percepción + Alerta, dif. 9) o una nube de locura sombría: -3 a la Iniciativa y -2 dados a quien no tenga Obtenebración.","ref":"Edad Oscura: Vampiro, p. 198"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 374"}},"o":0},{"id":"e58","cat":"Disciplinas","group":"Obtenebración","title":"Avatar Tenebroso","lvl":5,"v":{"eov":{"r":"3 puntos de sangre (3 turnos; cada punto extra quita un turno)","t":"Se convierte en sombra viva: inmune al daño físico pero sin poder atacar físicamente. Envolver a alguien exige tirada de Coraje. Puede seguir creando Brazos de Ahriman.","ref":"Edad Oscura: Vampiro, p. 198"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 374"}},"o":0},{"id":"e59","cat":"Disciplinas","group":"Obtenebración","title":"Paso por el Abismo","lvl":6,"v":{"eov":{"r":"Inteligencia + Sigilo (dif. 7)","t":"Entra en una sombra de tamaño humano y sale por otra lejana. Puede agarrar cosas a través de la sombra (Inteligencia + Pelea, dif. 7).","ref":"Edad Oscura: Vampiro, p. 198"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 375"}},"o":0},{"id":"e60","cat":"Disciplinas","group":"Ofuscación","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Ocultación mental: los demás no se dan cuenta de que ven al vampiro. Un observador con más Auspex que la Ofuscación del usuario lo descubre.","ref":"Edad Oscura: Vampiro, p. 199"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 378"}},"o":0},{"id":"e61","cat":"Disciplinas","group":"Ofuscación","title":"Capa de Sombras","lvl":1,"v":{"eov":{"r":"Sin tirada","t":"Invisible mientras permanezca quieto, en sombra o a cubierto. Se rompe al moverse o al llamar la atención.","ref":"Edad Oscura: Vampiro, p. 200"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 379"}},"o":0},{"id":"e62","cat":"Disciplinas","group":"Ofuscación","title":"Presencia Invisible","lvl":2,"v":{"eov":{"r":"Sin tirada (Astucia + Sigilo en situaciones delicadas, dif. ~7)","t":"Puede moverse sin ser visto si empieza oculto. Atacar o hacer algo llamativo rompe el efecto.","ref":"Edad Oscura: Vampiro, p. 200"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 379"}},"o":0},{"id":"e63","cat":"Disciplinas","group":"Ofuscación","title":"Máscara de las Mil Caras","lvl":3,"v":{"eov":{"r":"Manipulación + Interpretación (dif. 7)","t":"Cambia su aspecto aparente: más o menos atractivo (hasta el máximo por generación) o el de otra persona concreta; los éxitos necesarios dependen de lo distinta que sea. Hay que interpretar el papel.","ref":"Edad Oscura: Vampiro, p. 200"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 380"}},"o":0},{"id":"e64","cat":"Disciplinas","group":"Ofuscación","title":"Desvanecimiento","lvl":4,"v":{"eov":{"r":"Carisma + Sigilo (dif. = la Astucia + Alerta más alta de los testigos)","t":"Desaparece a plena vista. Con 3 éxitos o menos queda como una sombra fantasmal; con 4+ desaparece y los testigos con FV menor que los éxitos olvidan que estuvo allí.","ref":"Edad Oscura: Vampiro, p. 201"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 380"}},"o":0},{"id":"e65","cat":"Disciplinas","group":"Ofuscación","title":"Encubrimiento de la Concurrencia","lvl":5,"v":{"eov":{"r":"Según el poder que se extienda","t":"Extiende sus poderes de Ofuscación a un acompañante por cada punto de Sigilo. Quien rompa las reglas pierde la protección; si es el usuario, la pierde todo el grupo.","ref":"Edad Oscura: Vampiro, p. 201"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 380"}},"o":0},{"id":"e66","cat":"Disciplinas","group":"Ofuscación","title":"Enmascarar el Alma","lvl":6,"v":{"eov":{"r":"1-3 puntos de sangre, una escena","t":"Falsea su aura: color (1 punto), aparentar ser mortal o ghoul (2), ocultar diablerie o magia o no mostrar aura (3).","ref":"Edad Oscura: Vampiro, p. 201"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 382"}},"o":0},{"id":"e67","cat":"Disciplinas","group":"Potencia","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"Pasiva","t":"Cada punto es un éxito automático en las tiradas de Fuerza: proezas, levantar pesos y daño cuerpo a cuerpo. También cuenta en la diablerie. No tiene poderes con nombre en este libro.","ref":"Edad Oscura: Vampiro, p. 201"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 387"}},"o":0},{"id":"e68","cat":"Disciplinas","group":"Presencia","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Carisma sobrenatural y control de las emociones de grupos e individuos.","ref":"Edad Oscura: Vampiro, p. 202"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 390"}},"o":0},{"id":"e69","cat":"Disciplinas","group":"Presencia","title":"Fascinación","lvl":1,"v":{"eov":{"r":"Carisma + Expresión (dif. 7), una escena","t":"Embelesa a 1, 2, 6, 20 personas o a todos los presentes (de 1 a 5 éxitos), empezando por los de menor FV.","ref":"Edad Oscura: Vampiro, p. 202"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 390"}},"o":0},{"id":"e70","cat":"Disciplinas","group":"Presencia","title":"Mirada Aterradora","lvl":2,"v":{"eov":{"r":"Carisma + Intimidación (dif. = Astucia + Coraje de la víctima)","t":"Aterroriza: con 3+ éxitos la víctima huye. Cada éxito le quita un dado en el turno siguiente.","ref":"Edad Oscura: Vampiro, p. 202"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 391"}},"o":0},{"id":"e71","cat":"Disciplinas","group":"Presencia","title":"Encantamiento","lvl":3,"v":{"eov":{"r":"Manipulación + Empatía (dif. = FV permanente del blanco)","t":"El sujeto queda prendado y leal al vampiro durante un tiempo que depende de los éxitos. No se puede renovar hasta que termine el efecto.","ref":"Edad Oscura: Vampiro, p. 203"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 391"}},"o":0},{"id":"e72","cat":"Disciplinas","group":"Presencia","title":"Invocación","lvl":4,"v":{"eov":{"r":"Carisma + Subterfugio (dif. 5; 7 si es un extraño; 4 o 8 según usos previos)","t":"Llama a una persona que conozca, que acude desde cualquier distancia; los éxitos fijan la rapidez y la actitud con que llega.","ref":"Edad Oscura: Vampiro, p. 203"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 392"}},"o":0},{"id":"e73","cat":"Disciplinas","group":"Presencia","title":"Majestad","lvl":5,"v":{"eov":{"r":"1 FV, una escena","t":"Quien quiera mostrarse hostil o contradecir al vampiro tira Coraje (dif. = Carisma + Intimidación del vampiro). Si falla, renuncia y se humilla ante él.","ref":"Edad Oscura: Vampiro, p. 203"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 392"}},"o":0},{"id":"e74","cat":"Disciplinas","group":"Presencia","title":"Pasión","lvl":6,"v":{"eov":{"r":"Ver texto","t":"Provoca una emoción intensa e incontrolable (miedo, lujuria, envidia, amor, odio, ira) en un blanco.","ref":"Edad Oscura: Vampiro, p. 204"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 394"}},"o":0},{"id":"e75","cat":"Disciplinas","group":"Presencia","title":"Pasión","lvl":6,"v":{"eov":{"r":"Manipulación + Expresión (dif. 7 para una multitud)","t":"Desata una emoción incontrolable (amor, codicia, furia, miedo...) en un sujeto o en una multitud, empezando por los más cercanos. La furia provoca frenesí; el miedo, Rötschreck (dif. 5 + éxitos). Los mortales resisten con Autocontrol o Coraje.","ref":"Edad Oscura: Vampiro, p. 204"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 394"}},"o":0},{"id":"e76","cat":"Disciplinas","group":"Protean","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Cambio de forma: visión nocturna, garras, fundirse con la tierra, forma animal y niebla.","ref":"Edad Oscura: Vampiro, p. 205"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 397"}},"o":0},{"id":"e77","cat":"Disciplinas","group":"Protean","title":"Testigo de las Tinieblas","lvl":1,"v":{"eov":{"r":"Acción gratuita, tarda un turno","t":"Ojos inhumanos: ninguna penalización por oscuridad normal y +1 dado a Intimidar a mortales.","ref":"Edad Oscura: Vampiro, p. 205"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 398"}},"o":0},{"id":"e78","cat":"Disciplinas","group":"Protean","title":"Garras de la Bestia","lvl":2,"v":{"eov":{"r":"Acción gratuita (un turno) o 1 punto de sangre","t":"Garras que causan Fuerza + 1 de daño agravado.","ref":"Edad Oscura: Vampiro, p. 205"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 398"}},"o":0},{"id":"e79","cat":"Disciplinas","group":"Protean","title":"Enterramiento","lvl":3,"v":{"eov":{"r":"1 punto de sangre, un turno de concentración","t":"Se funde con la tierra natural y queda casi inmune a todo ataque. Solo puede usar poderes mentales como Auspex.","ref":"Edad Oscura: Vampiro, p. 205"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 398"}},"o":0},{"id":"e80","cat":"Disciplinas","group":"Protean","title":"Forma de la Bestia","lvl":4,"v":{"eov":{"r":"1 punto de sangre (3 turnos) o 3 (1 turno)","t":"Se transforma en lobo o murciélago y toma sus Atributos físicos y sus capacidades (como volar). Solo puede usar las Disciplinas que no requieran forma humana.","ref":"Edad Oscura: Vampiro, p. 206"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 399"}},"o":0},{"id":"e81","cat":"Disciplinas","group":"Protean","title":"Cuerpo de Espíritu","lvl":5,"v":{"eov":{"r":"1 punto de sangre (3 turnos) o 3 (1 turno)","t":"Se convierte en niebla: inmune a casi todo el daño físico, pero el viento lo arrastra (resiste con Potencia, dif. 6-10). Se mueve lentamente.","ref":"Edad Oscura: Vampiro, p. 206"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 399"}},"o":0},{"id":"e82","cat":"Disciplinas","group":"Protean","title":"Sueño Dichoso","lvl":6,"v":{"eov":{"r":"5 puntos de sangre, 3 turnos","t":"Niebla durmiente inmune al sol, al fuego y a las armas. Despierta en forma normal tras la siguiente puesta de sol.","ref":"Edad Oscura: Vampiro, p. 207"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 401"}},"o":0},{"id":"e83","cat":"Disciplinas","group":"Quimerismo","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Ilusiones que engañan a todos los sentidos. Es la Disciplina de los Ravnos. El usuario debe poder percibir la ilusión; si ocurre algo imposible, los testigos pueden descubrirla.","ref":"Edad Oscura: Vampiro, p. 207"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 404"}},"o":0},{"id":"e84","cat":"Disciplinas","group":"Quimerismo","title":"Ignis Fatuus","lvl":1,"v":{"eov":{"r":"1 FV, una acción","t":"Ilusión estática de un solo sentido. Dura mientras el usuario la perciba y quiera mantenerla, y se puede terminar como acción libre.","ref":"Edad Oscura: Vampiro, p. 208"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 405"}},"o":0},{"id":"e85","cat":"Disciplinas","group":"Quimerismo","title":"Dweomer","lvl":2,"v":{"eov":{"r":"1 FV + 1 punto de sangre","t":"Ilusión que engaña a todos los sentidos, fija en un lugar o unida a una persona, animal u objeto.","ref":"Edad Oscura: Vampiro, p. 208"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 406"}},"o":0},{"id":"e86","cat":"Disciplinas","group":"Quimerismo","title":"Aparición","lvl":3,"v":{"eov":{"r":"+1 punto de sangre sobre la ilusión","t":"Anima una ilusión, que actúa como quiera el usuario mientras se concentre. Si hace algo imposible, los testigos tiran Percepción (con Empatía o Trato con Animales) para descubrirla.","ref":"Edad Oscura: Vampiro, p. 208"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 406"}},"o":0},{"id":"e87","cat":"Disciplinas","group":"Quimerismo","title":"Permanencia","lvl":4,"v":{"eov":{"r":"1 punto de sangre, un turno","t":"Vuelve permanente una ilusión creada con Quimerismo.","ref":"Edad Oscura: Vampiro, p. 208"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 406"}},"o":0},{"id":"e88","cat":"Disciplinas","group":"Quimerismo","title":"Realidad Horrenda","lvl":5,"v":{"eov":{"r":"2 FV; Manipulación + Subterfugio (dif. = Percepción + Autocontrol/Instinto de la víctima)","t":"Una ilusión que solo ve la víctima la ataca: cada éxito es un nivel contundente que no se absorbe. Puede elegir hacer menos daño.","ref":"Edad Oscura: Vampiro, p. 209"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 407"}},"o":0},{"id":"e89","cat":"Disciplinas","group":"Quimerismo","title":"Horror Masivo","lvl":6,"v":{"eov":{"r":"2 FV","t":"Realidad Horrenda compartida por tantos blancos como su FV permanente. Los demás testigos ven una Aparición.","ref":"Edad Oscura: Vampiro, p. 209"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 408"}},"o":0},{"id":"e90","cat":"Disciplinas","group":"Serpentis","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Dones serpentinos de los Seguidores de Set, que solo se enseñan a iniciados de su culto.","ref":"Edad Oscura: Vampiro, p. 209"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 411"}},"o":0},{"id":"e91","cat":"Disciplinas","group":"Serpentis","title":"Ojos de Serpiente","lvl":1,"v":{"eov":{"r":"Manipulación + Etiqueta (dif. 4) para captar la mirada; contra vampiros, enfrentamiento de FV (dif. 7)","t":"Paraliza con la mirada: a los mortales, de forma automática. Quien sabe que no debe mirar no puede ser obligado.","ref":"Edad Oscura: Vampiro, p. 210"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 411"}},"o":0},{"id":"e92","cat":"Disciplinas","group":"Serpentis","title":"Lengua de Áspid","lvl":2,"v":{"eov":{"r":"Sin coste, un turno","t":"Lengua bífida de un metro: daño = Fuerza, agravado (Destreza + Pelea). Si hiere, puede alimentarse el turno siguiente como si mordiera.","ref":"Edad Oscura: Vampiro, p. 210"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 412"}},"o":0},{"id":"e93","cat":"Disciplinas","group":"Serpentis","title":"Piel de Víbora","lvl":3,"v":{"eov":{"r":"1 punto de sangre (3 turnos) o 3 (1 turno)","t":"Escamas: dificultad de absorción 5 y absorbe con Resistencia el agravado de garras y colmillos (no el fuego ni el sol). Puede colarse por huecos pequeños.","ref":"Edad Oscura: Vampiro, p. 210"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 412"}},"o":0},{"id":"e94","cat":"Disciplinas","group":"Serpentis","title":"Forma de Cobra","lvl":4,"v":{"eov":{"r":"1 punto de sangre (3 turnos) o 3 (1 turno)","t":"Cobra negra: +2 dados con el olfato, a Esquivar y a Trepar, -2 con el oído.","ref":"Edad Oscura: Vampiro, p. 210"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 412"}},"o":0},{"id":"e95","cat":"Disciplinas","group":"Serpentis","title":"Engañar a la Balanza de Anubis","lvl":5,"v":{"eov":{"r":"Ritual: Destreza + Medicina (dif. 7) por hora; noche sin luna","t":"Extrae su corazón (5 éxitos) para que no puedan estacarle, o alcanza la forma momificada (12 éxitos).","ref":"Edad Oscura: Vampiro, p. 211"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 413"}},"o":0},{"id":"e96","cat":"Disciplinas","group":"Serpentis","title":"Aliento de Tormenta de Arena","lvl":6,"v":{"eov":{"r":"1 punto de sangre; Destreza + Pelea (dif. 6)","t":"Nube abrasadora a 2 m que solo se puede esquivar. Los éxitos netos son daño agravado que solo absorbe la Fortaleza.","ref":"Edad Oscura: Vampiro, p. 212"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 414"}},"o":0},{"id":"e97","cat":"Disciplinas","group":"Taumaturgia","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"Cada poder de senda: 1 punto de sangre + FV (dif. = nivel + 3). Rituales: Inteligencia + Ocultismo (dif. 3 + nivel), unos 5 min por nivel","t":"Magia de sangre de los Tremere, organizada en sendas y rituales. En EO:V 2003 trae las sendas Rego Vitae, Creo Ignem, Rego Tempestas, Rego Motus, Rego Elementum y Transitus Velociter, y rituales de nivel 1 a 5.","ref":"Edad Oscura: Vampiro, p. 212"},"veo21":{"r":"Igual que en EO:V 2003","t":"Conserva las sendas de EO:V 2003 con el mismo texto y añade Creo Fulgura, Creo Tutelae, Muto Elementa, Perdo Magica, Rego Animam Mundi y Rego Larvae (estas dos, de los Tremere Telyavos). Trae muchos más rituales (59).","ref":"VEO21, p. 467"}},"o":0},{"id":"e98","cat":"Disciplinas","group":"Taumaturgia","title":"Sabor de la Sangre","lvl":1,"v":{"eov":{"r":"Estándar","t":"Probando una gota, averigua la generación (más alta o más baja que la suya), cuánto hace que se alimentó y cuánta sangre le queda; en mortales, si son ghouls o están enfermos. Si es sangre de un Cainita, cuenta como paso de juramento de sangre.","ref":"Edad Oscura: Vampiro, p. 213"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 477"}},"o":0,"sub":"Rego Vitae"},{"id":"e99","cat":"Disciplinas","group":"Taumaturgia","title":"Furia de la Sangre","lvl":2,"v":{"eov":{"r":"Estándar; tocar al blanco","t":"Cada éxito obliga al blanco a gastar un punto de sangre (en Atributos físicos o en curar), a elección del Tremere, y sube en uno su dificultad para resistir el frenesí.","ref":"Edad Oscura: Vampiro, p. 213"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 477"}},"o":0,"sub":"Rego Vitae"},{"id":"e100","cat":"Disciplinas","group":"Taumaturgia","title":"Sangre del Poder","lvl":3,"v":{"eov":{"r":"Estándar","t":"Cada éxito baja en uno su generación efectiva o añade una hora de duración (sin horas, dura un turno). Solo afecta a Dominación, al gasto de sangre por turno y a la reserva máxima.","ref":"Edad Oscura: Vampiro, p. 213"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 477"}},"o":0,"sub":"Rego Vitae"},{"id":"e101","cat":"Disciplinas","group":"Taumaturgia","title":"Robo de Vitae","lvl":4,"v":{"eov":{"r":"Estándar; hasta 15 m","t":"Cada éxito le roba un punto de sangre al blanco, que vuela hasta él por el aire. Al mortal le causa 1 nivel letal por punto. Si roba a un vampiro, cuenta como paso de juramento de sangre.","ref":"Edad Oscura: Vampiro, p. 213"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 477"}},"o":0,"sub":"Rego Vitae"},{"id":"e102","cat":"Disciplinas","group":"Taumaturgia","title":"Caldero de Sangre","lvl":5,"v":{"eov":{"r":"Estándar; tocar (Destreza + Pelea)","t":"Hace hervir la sangre: cada éxito destruye un punto de sangre y causa un nivel agravado. A un mortal lo mata con un solo éxito.","ref":"Edad Oscura: Vampiro, p. 213"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 478"}},"o":0,"sub":"Rego Vitae"},{"id":"e103","cat":"Disciplinas","group":"Taumaturgia","title":"Creo Ignem (senda)","lvl":0,"v":{"eov":{"r":"Estándar; 1 minuto por éxito antes de lanzarla; Percepción + Alerta para apuntar","t":"Crea fuego frío en la mano que arde de verdad al lanzarlo. El tamaño depende del nivel: vela (absorber dif. 3, 1 de daño), antorcha (4, 1), fogata (5, 2), pira (7, 2), incendio (9, 3). El daño es agravado y puede causar Rötschreck.","ref":"Edad Oscura: Vampiro, p. 214"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 468"}},"o":0,"sub":"Creo Ignem"},{"id":"e104","cat":"Disciplinas","group":"Taumaturgia","title":"Rego Tempestas (senda)","lvl":0,"v":{"eov":{"r":"Estándar; rapidez: de 12 h (1 éxito) a 1 turno (5)","t":"Controla el clima: niebla (•), lluvia (••), viento (•••), tormenta (••••) y relámpago (•••••, Percepción + Ocultismo para impactar, 10 dados letales). Dura unas escenas.","ref":"Edad Oscura: Vampiro, p. 214"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 476"}},"o":0,"sub":"Rego Tempestas"},{"id":"e105","cat":"Disciplinas","group":"Taumaturgia","title":"Rego Motus (senda)","lvl":0,"v":{"eov":{"r":"Estándar; un turno por éxito (5 éxitos: una escena); un ser consciente resiste con FV","t":"Telequinesis: medio kilo (•), 10 kg (••), 100 kg y volar (•••), 250 kg (••••), 500 kg (•••••). Puede blandir armas a distancia.","ref":"Edad Oscura: Vampiro, p. 215"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 475"}},"o":0,"sub":"Rego Motus"},{"id":"e106","cat":"Disciplinas","group":"Taumaturgia","title":"Fuerza de la Tierra","lvl":1,"v":{"eov":{"r":"Estándar","t":"Reparte 3 puntos temporales entre Fuerza y Resistencia durante un turno por éxito, mientras toque el suelo. No es acumulable.","ref":"Edad Oscura: Vampiro, p. 215"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 472"}},"o":0,"sub":"Rego Elementum"},{"id":"e107","cat":"Disciplinas","group":"Taumaturgia","title":"Lengua de Madera","lvl":2,"v":{"eov":{"r":"Estándar","t":"Habla con el espíritu de un objeto inanimado; los éxitos determinan cuánta información útil da.","ref":"Edad Oscura: Vampiro, p. 215"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 473"}},"o":0,"sub":"Rego Elementum"},{"id":"e108","cat":"Disciplinas","group":"Taumaturgia","title":"Animar lo Inmóvil","lvl":3,"v":{"eov":{"r":"Estándar + 1 FV","t":"Anima un objeto durante hasta una hora, mientras lo vea. Puede controlar tantos objetos como su Inteligencia.","ref":"Edad Oscura: Vampiro, p. 216"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 473"}},"o":0,"sub":"Rego Elementum"},{"id":"e109","cat":"Disciplinas","group":"Taumaturgia","title":"Forma Elemental","lvl":4,"v":{"eov":{"r":"Estándar","t":"Se transforma en tierra, aire o agua (y en fuego frío si domina Creo Ignem). Con 3 éxitos mantiene los sentidos y las Disciplinas mentales. Es casi inmune al daño, pero queda inmóvil.","ref":"Edad Oscura: Vampiro, p. 216"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 473"}},"o":0,"sub":"Rego Elementum"},{"id":"e110","cat":"Disciplinas","group":"Taumaturgia","title":"Invocar Elemental","lvl":5,"v":{"eov":{"r":"Estándar; después, Manipulación + Ocultismo (dif. = éxitos + 4) para controlarlo","t":"Invoca una salamandra, un silfo, un gnomo o una ondina, más poderosos cuantos más éxitos. Con un fracaso al controlarlo, el elemental ataca.","ref":"Edad Oscura: Vampiro, p. 216"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 474"}},"o":0,"sub":"Rego Elementum"},{"id":"e111","cat":"Disciplinas","group":"Taumaturgia","title":"Transitus Velociter (senda)","lvl":0,"v":{"eov":{"r":"Estándar; 50 km/h durante 1 hora por éxito","t":"Viajes largos a gran velocidad: 1 criatura (•), 6 monturas (••), 12 (•••), 24 (••••), 48 monturas o 16 carros (•••••).","ref":"Edad Oscura: Vampiro, p. 217"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 478"}},"o":0,"sub":"Transitus Velociter"},{"id":"e112","cat":"Disciplinas","group":"Taumaturgia","title":"Rituales","lvl":0,"v":{"eov":{"r":"Inteligencia + Ocultismo (dif. 3 + nivel)","t":"Nivel 1: Desviación de la Muerte de Madera, Toque del Diablo, Despertar con la Frescura de la Tarde. Nivel 2: Revelación del Linaje de Sangre, Portar la Máscara de Sombras, Foco de Infusión de Vitae, Protección contra Ghouls. Nivel 3: Carne de Roce Ígneo, Paso Incorpóreo, Astilla del Sosiego Retardado. Nivel 4: Corazón de Piedra, Protección contra Cainitas. Nivel 5: Contrato de Sangre, Escapar hacia un Amigo Fiel, Protección contra Espíritus.","ref":"Edad Oscura: Vampiro, p. 217"},"veo21":{"t":"Nivel 1: Ahora su vista nos pertenece (p. 478), Comunicación con el sire (p. 479), Defensa del refugio sagrado (p. 479), Despertar con la frescura de la tarde (p. 479), Desviación de la muerte de madera (p. 480), Epístola de babel (p. 480), Guijarro sanguíneo (p. 480), La mosca de la carne demorada (p. 481), Piedra ligera (p. 481), Pureza de la carne (p. 482), Ser uno con la tierra (p. 482), El toque del diablo (p. 482) · Nivel 2: Apropiación de la membrana (p. 482), Conocer a la bestia antinatural (p. 483), Cuchilla llameante (p. 483), Desinterés por el festejo (p. 483), Foco de infusión de vitae (p. 484), Piel de camaleón (p. 485), Polvo del recuerdo (p. 485), Portar la máscara de sombras (p. 485), Protección contra ghouls (p. 485), Revelación del linaje de sangre (p. 486), Roba vuestros susurros (p. 486), Se sabrá tu destino (p. 486), Senda indetectable (p. 487), Transustanciación de humores (p. 487) · Nivel 3: Anguila de mercurio (p. 487), Astilla del sosiego retardado (p. 488), Atar al familiar (p. 489), Carne de roce ígneo (p. 490), Certamen (p. 490), Corriente sanguínea de la tierra (p. 491), Crisol de agonía compartida (p. 491), Defensor del refugio (p. 492), El despertar de la espina verde (p. 492), Desplazamiento del neuma (p. 493), Paso incorpóreo (p. 494), Protección contra lupinos (p. 494), Ritual del escudo mágico (p. 494) · Nivel 4: Alma del dominio (p. 494), Consagración del santuario (p. 495), Corazón de piedra (p. 495), Fusión con la tierra (p. 495), Habla la cabeza de bronce (p. 495), Protección contra cainitas (p. 497), Protección contra seres feéricos (p. 497), Suspensión de encantamiento (p. 497) · Nivel 5: Contrato de sangre (p. 497), Escapar hacia un amigo fiel (p. 498), Filacteria de sangre (p. 498), Protección contra espíritus (p. 499), Protección contra magos (p. 499), Respira cuando se lo ordenamos (p. 499), Tocar la mente del protector (p. 500), Transformar la piel en piedra (p. 501) · Nivel 6: Don de la forma inmóvil (p. 501), Otras magias (p. 502), De sangre (p. 502)","ref":"VEO21, p. 478+"},"veo1":{"t":"Ojo: en este suplemento la dificultad es 4 + nivel; en EO:V 2003 es 3 + nivel. Rituales nuevos de Ceoris. Nivel 1: La Mosca de la Carne Demorada, Ahora su Vista nos Pertenece. Nivel 2: Polvo del Recuerdo, Apropiación de la Membrana, Roba Vuestros Susurros, Se Sabrá tu Destino. Nivel 3: Crisol de Agonía Compartida, Desplazamiento del Neuma, Icor del Hexápodo, Poblar los Jardines de la Noche, Anguila de Mercurio. Nivel 4: Habla la Cabeza de Bronce, Integumento Furtivo. Nivel 5: Respira Cuando se lo Ordenamos. Varios de ellos reaparecen en VEO21.","ref":"La Casa de Tremere (1ª ed.), p. 110-116","r":"Inteligencia + Ocultismo (dif. 4 + nivel); 5 min por nivel"}},"o":0,"sub":"Rituales"},{"id":"e113","cat":"Disciplinas","group":"Vicisitud","title":"(Disciplina)","lvl":0,"v":{"eov":{"r":"","t":"Moldeado de carne y hueso, propio de los Tzimisce. Usa la Habilidad especial Alteración Corporal.","ref":"Edad Oscura: Vampiro, p. 221"},"veo21":{"same":"eov","t":"Misma descripción y sistema base que en EO:V 2003.","ref":"VEO21, p. 432"}},"o":0},{"id":"e114","cat":"Disciplinas","group":"Vicisitud","title":"Semblante Maleable","lvl":1,"v":{"eov":{"r":"1 punto de sangre por rasgo; Inteligencia + Alteración Corporal (dif. 6)","t":"Modifica su propio cuerpo. Para copiar a otra persona: Percepción + Alteración Corporal (dif. 8), y 5 éxitos para una copia perfecta. Subir su Apariencia es dif. 10; si fracasa, la pierde para siempre.","ref":"Edad Oscura: Vampiro, p. 222"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 433"}},"o":0},{"id":"e115","cat":"Disciplinas","group":"Vicisitud","title":"Transmutar la Arcilla Mortal","lvl":2,"v":{"eov":{"r":"Destreza + Alteración Corporal (dif. 5-9); sujetar a la víctima","t":"Moldea la carne ajena: cada éxito sube o baja un Atributo, normalmente la Apariencia (bajarlo es dif. 5).","ref":"Edad Oscura: Vampiro, p. 222"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 433"}},"o":0},{"id":"e116","cat":"Disciplinas","group":"Vicisitud","title":"Desgarrar la Estructura Ósea","lvl":3,"v":{"eov":{"r":"Fuerza + Alteración Corporal (dif. 7 como ataque)","t":"Moldea también el hueso. Como ataque, cada éxito es un nivel letal. Las víctimas Cainitas curan las deformaciones como daño agravado.","ref":"Edad Oscura: Vampiro, p. 222"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 434"}},"o":0},{"id":"e117","cat":"Disciplinas","group":"Vicisitud","title":"Despertar la Forma Zulo","lvl":4,"v":{"eov":{"r":"2 puntos de sangre","t":"Forma de combate monstruosa: +3 a Fuerza, Destreza y Resistencia; Atributos Sociales a 0 (salvo para intimidar, con Fuerza); +1 al daño cuerpo a cuerpo.","ref":"Edad Oscura: Vampiro, p. 223"},"veo21":{"same":"eov","t":"Mismo texto que en EO:V 2003.","ref":"VEO21, p. 434"}},"o":0},{"id":"e118","cat":"Disciplinas","group":"Vicisitud","title":"Influjo del Humor Sanguíneo ,"o":0,"sub":"Rego Larvae"},{"id":"e339","cat":"Disciplinas","group":"Hechicería Assamita","title":"(Disciplina)","lvl":0,"v":{"veo21":{"r":"Tirada de Camino o tirada normal","t":"Magia de sangre de los hechiceros Assamitas, más improvisada que la de los Tremere. Sendas: Sada Ghadub Allah (Ecos de la Cólera de Alá: maldiciones del sol, la sed, la rabia...) y Susurros de los Cielos (astrología: mapa estelar, destino, adivinación), con rituales propios.","ref":"VEO21, p. 502"},"eov":{"t":"No existe como Disciplina propia: se usa la Taumaturgia. Los hechiceros Assamitas pueden elegir cualquier senda primaria; los Setitas deben elegir Rego Tempestas y los koldun Tzimisce, Rego Elementum. Ninguna tradición puede aprender la magia de senda de otra, pero sí compartir rituales (Inteligencia + Ocultismo para traducirlos, dos semanas por nivel).","ref":"Edad Oscura: Vampiro, p. 217 (recuadro Otros hechiceros)"}},"o":0},{"id":"e340","cat":"Disciplinas","group":"Hechicería Assamita","title":"Maldición del Semblante sin Vida","lvl":1,"v":{"veo21":{"r":"Camino (dif. = FV del objetivo)","t":"Maldición de ostracismo: los mortales rechazan al objetivo.","ref":"VEO21, p. 503"}},"o":0,"sub":"Sada Ghadub Allah"},{"id":"e341","cat":"Disciplinas","group":"Hechicería Assamita","title":"Maldición del Dolor Celestial","lvl":2,"v":{"veo21":{"r":"Camino (dif. = FV)","t":"El objetivo se vuelve vulnerable a la fe y a lo sagrado.","ref":"VEO21, p. 503"}},"o":0,"sub":"Sada Ghadub Allah"},{"id":"e342","cat":"Disciplinas","group":"Hechicería Assamita","title":"Maldición de la Rabia Desatada","lvl":3,"v":{"veo21":{"r":"Ver el texto","t":"Despierta una Bestia en el objetivo: los mortales pueden sufrir frenesí.","ref":"VEO21, p. 504"}},"o":0,"sub":"Sada Ghadub Allah"},{"id":"e343","cat":"Disciplinas","group":"Hechicería Assamita","title":"Maldición de la Sed Insaciable","lvl":4,"v":{"veo21":{"r":"Ver el texto","t":"El objetivo necesita beber sangre para sobrevivir.","ref":"VEO21, p. 504"}},"o":0,"sub":"Sada Ghadub Allah"},{"id":"e344","cat":"Disciplinas","group":"Hechicería Assamita","title":"Maldición del Sol Prohibido","lvl":5,"v":{"veo21":{"r":"Ver el texto","t":"La luz del día quema al objetivo como a un vampiro.","ref":"VEO21, p. 505"}},"o":0,"sub":"Sada Ghadub Allah"},{"id":"e345","cat":"Disciplinas","group":"Hechicería Assamita","title":"Mapa Estelar","lvl":1,"v":{"veo21":{"r":"Normal","t":"Sabe dónde se encuentra gracias a las estrellas.","ref":"VEO21, p. 505"}},"o":0,"sub":"Susurros de los Cielos"},{"id":"e346","cat":"Disciplinas","group":"Hechicería Assamita","title":"Conocer los Planes Celestiales","lvl":2,"v":{"veo21":{"r":"Normal; tocar a la persona o pisar el lugar","t":"Lee el destino próximo de una persona o de un lugar.","ref":"VEO21, p. 505"}},"o":0,"sub":"Susurros de los Cielos"},{"id":"e347","cat":"Disciplinas","group":"Hechicería Assamita","title":"Llamar a la Luna del Cazador","lvl":3,"v":{"veo21":{"r":"Declarar el acto antes de tirar","t":"Bonificación de las estrellas a una empresa concreta.","ref":"VEO21, p. 506"}},"o":0,"sub":"Susurros de los Cielos"},{"id":"e348","cat":"Disciplinas","group":"Hechicería Assamita","title":"Buscar el Favor del Alma","lvl":4,"v":{"veo21":{"r":"Normal","t":"Cada éxito revela un dato del verdadero ser de alguien a partir de su fecha de nacimiento.","ref":"VEO21, p. 507"}},"o":0,"sub":"Susurros de los Cielos"},{"id":"e349","cat":"Disciplinas","group":"Hechicería Assamita","title":"Enigmas del Mar de Estrellas","lvl":5,"v":{"veo21":{"r":"Normal","t":"Observa sucesos lejanos.","ref":"VEO21, p. 507"}},"o":0,"sub":"Susurros de los Cielos"},{"id":"e350","cat":"Disciplinas","group":"Hechicería Koldúnica","title":"(Disciplina)","lvl":0,"v":{"veo21":{"r":"Tirada de activación + sangre","t":"Magia elemental de los Tzimisce kolduny, en Caminos: Agua, Espíritu, Fuego, Tierra y Viento.","ref":"VEO21, p. 514"},"eov":{"t":"No existe como Disciplina propia: se usa la Taumaturgia. Los hechiceros Assamitas pueden elegir cualq árbaros»: una síntesis mongola de la Bestia y la Caballería. Los sedentarios que no saben defenderse merecen perderlo todo. Protegen a su familia y a sus hermanos anda, y valoran la honestidad y la disciplina, pero luchan para ganar a toda costa. Ojo: sus Virtudes son Convicción y Autocontrol, mientras que en VEO21 es un sendero de la Bestia con Convicción e Instinto.","ref":"Vientos de Oriente (1ª ed.), p. 75 (PDF)"}},"o":0,"sub":"Camino de la Bestia","h":{"veo21":["Pasar más de tres noches en el mismo lugar.","Desobedecer las órdenes de tu noyan.","Mentir a alguien que ha demostrado ser honesto.","Ignorar un insulto.","Abusar de tu rebaño.","Realizar tareas “civilizadas”.","Perder un combate por honor.","Mentir a tu familia o anda.","Traicionar a tu familia.","Traicionar a tu anda."]}},{"id":"e376","cat":"Senderos y Virtudes","group":"Senderos","title":"Sendero de la Divinidad (Via Divinitatis)","lvl":0,"v":{"veo21":{"t":"Remoquete: Divinistas (Herejes). Virtudes: Conciencia, Autocontrol (las del camino). Aura: Como el camino. La sangre de Caín te hace superior a los mortales: el rebaño debe ser guiado por ti. En VEO21 tiene su propia jerarquía de pecados.","ref":"VEO21, p. 197"},"eov":{"t":"Aparece solo como sendero de una línea dentro del Camino del Cielo, sin jerarquía propia: se usa la del camino. · El suplemento oficial El Camino del Cielo le da su propia jerarquía de pecados. VEO21 la reproduce casi literalmente, así que se muestra la misma lista.","ref":"Edad Oscura: Vampiro, p. 103 · El Camino del Cielo (EO:V), p. 54 (PDF)"}},"o":0,"sub":"Camino del Cielo","h":{"veo21":["Permitir que los mortales violen los Diez Mandamientos.","No pronunciarse en contra de la corrupción y el pecado.","Actuar guiado por el orgullo, la avaricia o algún otro impulso pecaminoso.","Robar, hurtar o cometer actos vandálicos de manera intencionada.","Causar daño a una persona piadosa y virtuosa.","Alimentarse de un inocente sin permiso.","Cometer actos blasfemos o heréticos.","Per
