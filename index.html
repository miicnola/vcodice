mbios de redacción. Remoquete: Buscadores. Virtudes: Convicción, Instinto.","ref":"Libro del Narrador, p. 26-27 (PDF)"}},"o":0,"h":{"veo21":["Fracasar a la hora de cabalgar un frenesí.","Compartir gratuitamente unos conocimientos inmerecidos.","Ser indulgente con las emociones.","Exigir un conocimiento que no se merece.","Rechazar las necesidades básicas.","Rechazar una experimentación necesaria que supone un riesgo personal.","Complacer deseos innecesarios.","Ayudar a un Cainita indigno a comprender el Camino de la Metamorfosis.","Rechazar un experimento necesario debido a la compasión o insatisfacción.","Evitar la alteración de tu propio cuerpo."]}},{"id":"e395","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino de la Noche (Via Noctis)","lvl":0,"v":{"veo21":{"t":"Remoquete: Confesores, Redentores. Virtudes: Convicción, Autocontrol. Aura: Culpa y remordimiento. Los Cainitas están malditos: castigar a los pecadores para salvar a los mortales. Propio de los Lasombra.","ref":"VEO21, p. 226"},"ldn":{"t":"Camino menor oficial con su propia jerarquía de pecados. VEO21 la reproduce con el mismo contenido y pequeños cambios de redacción. Remoquete: Confesores, Redentores. Virtudes: Convicción, Autocontrol.","ref":"Libro del Narrador, p. 27-28 (PDF)"}},"o":0,"h":{"veo21":["Dedicar demasiado tiempo a los asuntos de los Cainitas.","Sentir remordimientos por tus acciones.","Matar a cualquier mortal sin haber obtenido primero una confesión.","Intentar “salvar” a un Cainita.","Aceptar la superioridad de un Cainita ajeno a la jerarquía del Camino de la Noche u otros miembros de tu clan.","Matar a un pecador por cualquier otra razón que no sea defensa propia.","Tratar de salvar a un pecador empleando medios distintos al dolor y el sufrimiento.","Permitir la corrupción de los mortales.","Abrazar a un pecador que todavía es capaz de sentir remordimiento y redención.","Provocar la corrupción de un mortal."]}},{"id":"e396","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino de la Paradoja (Via Paradoxi)","lvl":0,"v":{"veo21":{"t":"Remoquete: Embusteros. Virtudes: Convicción, Autocontrol. Aura: Confianza. Guiar a cada uno hacia su verdadero destino. Propio de los Ravnos.","ref":"VEO21, p. 228"},"ldn":{"t":"Camino menor oficial con su propia jerarquía de pecados. VEO21 la reproduce con el mismo contenido y pequeños cambios de redacción. Remoquete: Embusteros. Virtudes: Convicción, Autocontrol.","ref":"Libro del Narrador, p. 29-30 (PDF)"}},"o":0,"h":{"veo21":["No rebelarse contra las convenciones sociales restrictivas.","Fallar en la misión de ejecutar a un Cainita testarudo que se niegue a comprender su destino.","Abrazar fuera del linaje familiar.","Permitir que tus objetivos conozcan tus intenciones.","Fallar en la misión de ejecutar a un Cainita que impida repetidamente que los mortales sigan sus fines personales.","Permitir que quienes no siguen el camino vislumbren tu verdadero yo.","Destruir a un compañero del camino.","Asesinar a un mortal que no ha completado su destino por cualquier razón que no sea defenderse.","Abrazar sin necesidad, dejándote llevar por el deseo o hacerlo sin consideración.","Creer que cualquier otro es superior a ti."]}},{"id":"e397","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino de la Sangre (Via Sanguinis)","lvl":0,"v":{"veo21":{"t":"Remoquete: Centinelas. Virtudes: Convicción, Autocontrol. Aura: Resolución. La sangre de Haqim debe merecerse: juzgar a los indignos. Propio de los Assamitas.","ref":"VEO21, p. 230"},"ldn":{"t":"Camino menor oficial con su propia jerarquía de pecados. VEO21 la reproduce con el mismo contenido y pequeños cambios de redacción. Remoquete: Centinelas. Virtudes: Convicción, Autocontrol.","ref":"Libro del Narrador, p. 23-24 (PDF)"}},"o":0,"h":{"veo21":["Reaccionar de forma impulsiva ante cualquier situación.","Permitir que la emoción dirija las acciones.","Sucumbir al frenesí.","Fallar a la hora de diabolizar a un vampiro indigno.","Actuar con cobardía o deshonra.","Permitir que los indignos no sean castigados.","Mostrar debilidad ante los indignos.","Fracasar a la hora de cumplir un juramento.","Someterse a la voluntad de un príncipe o antiguo indigno.","Vincularse con un juramento a otro Cainita."]}},{"id":"e398","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino de la Serpiente (Via Serpentis)","lvl":0,"v":{"veo21":{"t":"Remoquete: Tentadores. Virtudes: Convicción, Instinto. Aura: Devoción. Religión de Set: liberar a los mortales de las cadenas de Osiris. Propio de los Seguidores de Set.","ref":"VEO21, p. 232"},"ldn":{"t":"Camino menor oficial con su propia jerarquía de pecados. VEO21 la reproduce con el mismo contenido y pequeños cambios de redacción. Remoquete: Tentadores. Virtudes: Convicción, Instinto.","ref":"Libro del Narrador, p. 31-32 (PDF)"}},"o":0,"h":{"veo21":["Fracasar a la hora de dar rienda suelta a tus necesidades cuando no interfieran en tu misión.","Permitir que tus deseos te dominen cuando interfieren en tu devoción a Set.","Fallar a la hora de acumular riquezas e influencia.","Fracasar en el intento de extender la verdad de Set entre los mortales.","Fracasar a la hora de alentar a los mortales para que se liberen de la presa de Osiris.","Abusar de un ghoul.","Apoyar la ley de cualquier manera.","Someter a cualquier otro vampiro al juramento de sangre.","Abrazar a alguien que no sea devoto de Set.","Fracasar en la misión de recordar a Set y seguirle con devoción."]}},{"id":"e399","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino de Caín","lvl":0,"v":{"veo21":{"t":"Remoquete: Nodistas. Virtudes: Convicción, Autocontrol. Aura: Fe. Seguir el ejemplo de Caín; nació como sendero del Camino de la Sangre. No existe en EO:V 2003 ni en el Libro del Narrador.","ref":"VEO21, p. 234"}},"o":0,"h":{"veo21":["No seguir a Caín aunque haya riesgo de muerte.","No tomar el ejemplo de Caín en una decisión.","No sucumbir al frenesí cuando es conveniente, o hacerlo cuando no.","No diabolizar a un vampiro indigno.","Actuar con cobardía o deshonra o deshonrar a Caín.","No castigar una afrenta a Caín.","Poner a un mortal por encima de un Cainita.","Romper un juramento.","Seguir a quienes se oponen a Caín.","Vincularse mediante el Juramento de Sangre."]}},{"id":"e400","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino de Lilith","lvl":0,"v":{"veo21":{"t":"Remoquete: Bahari, Lilin. Virtudes: Convicción, Instinto. Aura: Tribulación. Elevarse mediante el dolor, siguiendo las enseñanzas de Lilith. No existe en EO:V 2003 ni en el Libro del Narrador.","ref":"VEO21, p. 236"}},"o":0,"h":{"veo21":["Alimentarse de inmediato cuando se está hambriento.","Buscar riqueza o poder temporal.","No corregir los errores cometidos por Caín contra Lilith.","Sentir remordimientos por provocar dolor.","No participar en un ritual Bahari.","Temer a la muerte.","Matar a un ser vivo o no muerto.","No buscar las enseñanzas de Lilith.","No dispensar dolor y sufrimiento.","Evitar el dolor."]}},{"id":"e401","cat":"Disciplinas","group":"Taumaturgia","title":"Rego Magica (senda)","lvl":0,"v":{"veo1":{"t":"Senda secreta del Círculo Interior para convertir la magia hermética en magia de sangre. Permite crear sendas nuevas (Creo, Rego, Intellego, Muto o Perdo sobre una única fuerza u objeto), poder a poder del 1 al 5. Para crear un poder hace falta tener 2 puntos más de Rego Magica que su nivel. Exige 1 año de estudio por nivel (30 horas a la semana) y una tirada de Inteligencia + Ocultismo (dif. 6) con tantos éxitos como el nivel. Si falla, 6 meses más por nivel.","ref":"La Casa de Tremere (1ª ed.), p. 106-107","r":"1 punto de sangre + FV, como el resto de sendas"}},"o":0,"sub":"Rego Magica"},{"id":"e402","cat":"Disciplinas","group":"Taumaturgia","title":"Crear rituales nuevos","lvl":0,"v":{"veo1":{"t":"Con Rego Magica se diseñan rituales nuevos a partir de rituales herméticos. El Narrador fija el nivel según su impacto. Estudio inicial: 1 mes (nivel 1), 3 meses (2), 1 año (3), 3 años (4) o 10 años (5). Si el intento falla, hay que esperar de 1 semana a 5 años antes del siguiente.","ref":"La Casa de Tremere (1ª ed.), p. 107-109","r":"Estudio + tirada de ejecución"}},"o":0,"sub":"Rituales"},{"id":"e403","cat":"Disciplinas","group":"Taumaturgia","title":"Humores malignos (pociones Tremere)","lvl":0,"v":{"veo1":{"t":"Pociones alquímicas de Ceoris. Nivel 1: Dosis de Justa Aquiescencia. Nivel 2: Filtro del Auténtico Recuerdo, Brebaje de la Ira Fundida, Poción del Martirio, La Leche Cruel de la Serpiente. Nivel 3: Bilis Cáustica, Medicamento de la Carne Resistente, Las Lágrimas de Phoebus. Nivel 5: Suero de la Vitae Perpetuada. De nivel variable: Icor de la Transmisión Oculta y Suero de la Exhortación Pavoneada.","ref":"La Casa de Tremere (1ª ed.), p. 117-120","r":"Según cada humor"}},"o":0,"sub":"Alquimia"},{"id":"e404","cat":"Creación y sistemas","group":"Habilidades nuevas","title":"Trato con las Gárgolas","lvl":0,"v":{"veo1":{"t":"1: puedes hablar con una Gárgola sin que quiera matarte. 2: con permiso de Virstania, obedece las órdenes que tengan sentido. 3: obedece incluso las que no lo tienen. 4: asume que tienes ese permiso. Nivel superior (Leyenda): las Gárgolas te reconocen como figura de autoridad (ver el texto).","ref":"La Casa de Tremere (1ª ed.), p. 121","r":"Habilidad 1-5"}},"o":0},{"id":"e405","cat":"Senderos y Virtudes","group":"Caminos de clan (menores)","title":"Camino del Servicio (Gárgolas)","lvl":0,"v":{"veo1":{"t":"Camino propio de las Gárgolas de Ceoris: obediencia a Virstania (la Gran Madre), a los Creadores y a los señores Tremere, por encima de sus pasiones (odio a los clanes de los que salieron sus partes, dominancia, protección de su prole). La tirada de degeneración es de Conciencia. Orden de la jerarquía tal como aparece en el escaneo: compruébalo en el libro.","ref":"La Casa de Tremere (1ª ed.), p. 120-122"}},"o":0,"h":{"veo1":["Desobedecer una orden directa de la Gran Madre.","Desobedecer la orden directa de otro Creador.","Desobedecer una orden directa de un señor Tremere al que un Creador haya dado autoridad sobre las Gárgolas.","Frustrar el cumplimiento de una orden de la Gran Madre.","Desobedecer a cualquier señor.","No castigar un agravio contra los señores.","No vengar un crimen contra los señores.","Señalar la falibilidad de los señores.","Huir de la ocasión de ser herido en batalla contra los enemigos de los señores.","Huir de la ocasión de morir gloriosamente cumpliendo el deber."]}},{"id":"e406","cat":"Disciplinas","group":"Poderes combinados","title":"Mirada Recta (Potencia 3, Presencia 2)","lvl":0,"v":{"eov":{"t":"Quema al pecador desde dentro: al turno siguiente sufre tantos niveles agravados como éxitos, que solo absorbe con Fortaleza (dif. 7, modificada por su aura). No funciona contra Fieles con más Camino. Un mismo blanco no puede volver a ser juzgado hasta que cambie su Camino. Si fracasa, no puede repetirlo sin un Acto de Contrición.","ref":"El Camino del Cielo (EO:V), p. 58 (PDF)","r":"Contacto visual; tirada de Camino (dif. = Camino del blanco); 21 PX"}},"o":0,"sub":"El Camino del Cielo"},{"id":"e407","cat":"Disciplinas","group":"Poderes combinados","title":"«Halo de Acero» (Fortaleza 3, FV 6+; nombre poco legible en el escaneo)","lvl":0,"v":{"eov":{"t":"Ignora todas las penalizaciones por heridas durante un turno por éxito. Al terminar, sufre las heridas normalmente (puede incluso convertirse en cenizas).","ref":"El Camino del Cielo (EO:V), p. 58 (PDF)","r":"1 punto de sangre (reflejo, no cuenta para el máximo por turno); Camino (dif. 6); 21 PX"}},"o":0,"sub":"El Camino del Cielo"},{"id":"e408","cat":"Disciplinas","group":"Poderes combinados","title":"Momento de Gracia (Dominación 4, Presencia 3)","lvl":0,"v":{"eov":{"t":"Durante una escena, el blanco pasa a seguir el Camino del Cielo con un valor igual a los éxitos, y degenera según su jerarquía. Los puntos que pierda se conservan al volver a su camino. No funciona con Fieles ni con blancos de Camino más alto.","ref":"El Camino del Cielo (EO:V), p. 58-59 (PDF)","r":"Tocar y mirar; 1 FV + 1 punto de sangre; Camino (dif. = Camino del blanco)"}},"o":0,"sub":"El Camino del Cielo"},{"id":"e409","cat":"Disciplinas","group":"Hechicería Assamita","title":"Sada Ghadub Allah (Ecos de la Cólera de Alá)","lvl":0,"v":{"eov":{"t":"Senda oficial de EO:V en este suplemento. Lanza tantas maldiciones como éxitos, hasta el número de niveles aprendidos (Semblante sin Vida, Dolor Celestial, Rabia Desatada, Sed Insaciable, Sol Prohibido). Su duración depende del Camino del lanzador: 1-3, una hora por éxito; 4-6, un día; 7-9, tres días; 10, una semana. Solo el lanzador puede anularlas antes.","ref":"El Camino del Cielo (EO:V), p. 60-61 (PDF)","r":"1 punto de sangre + tirada de Camino; ver al objetivo"}},"o":0,"sub":"Sada Ghadub Allah"},{"id":"e410","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Hierro de protección (Fieles)","lvl":0,"v":{"eov":{"t":"Talismán que mantiene alejadas a las criaturas malignas: para acercarse a menos de 1,5 m hace falta superar FV (dif. 5). Dura un día por éxito. Afecta también a su creador.","ref":"El Camino del Cielo (EO:V), p. 65 (PDF)","r":"Camino 8+; una noche de oración; 1 nivel letal; Camino (dif. 7)"}},"o":0},{"id":"e411","cat":"Creación y sistemas","group":"Méritos y Defectos","title":"Méritos y Defectos de los Fieles","lvl":0,"v":{"eov":{"t":"Cara de Ángel (Mérito o Defecto de 1: el modificador de aura se suma o resta a la Apariencia). Gemelo de Jacob (1: -1 a la dificultad Social ante devotos de un santo al que te pareces). Confesor Célebre (1-3). Salva a tu Siervo (3: el daño que te infliges por penitencia es contundente y se cura con 1 punto de sangre). Miroblita Bendecido (4). Del Abrazo Anunciado (5: repite 3 tiradas por historia ligadas a tu destino y recupera 1 FV). Redimido (7: la Fe Verdadera no te daña; si pierdes Camino, tira el nuevo Camino a dif. 9 o pierdes el Mérito). Defectos: Criptófago (2), Alma de la Oscuridad (2-4), Estigmas (3: cada noche despiertas Magullado).","ref":"El Camino del Cielo (EO:V), p. 62-64 (PDF)"}},"o":0,"sub":"El Camino del Cielo"},{"id":"e412","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Batallas a gran escala","lvl":0,"v":{"eov":{"t":"El Libro del Narrador da un sistema de batallas en masa: en cada turno el personaje elige una acción (combatir, usar una Habilidad o una Disciplina instantánea...) y se aplican la moral de las tropas (tirada de 3 dados ante horrores sobrenaturales, como un Cainita alimentándose o en frenesí) y el terreno. Despojos de Guerra lo amplía con Disciplinas prolongadas, ataques de personajes contra unidades, contraataques (solo a un Cainita se le puede estacar, con 5+ éxitos) y moral ante cualquier «asesino sobrenatural».","ref":"Libro del Narrador, p. 60-63 (PDF) · Despojos de Guerra (EO:V), p. 36-37 (PDF)","r":"Por turnos de batalla"}},"o":0},{"id":"e413","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Campaña: saqueo, enfermedad y asedio","lvl":0,"v":{"eov":{"t":"Saqueo: Percepción + Supervivencia dos veces al día; éxitos x saqueadores = días de comida. Enfermedad en el ejército: Astucia + Medicina semanal (dif. = soldados/1000, máx. 10); cada fallo acumula +1 a todas sus tiradas. Máquinas de asedio: reunir materiales con Percepción + Pericias (dif. 7) y montarlas con Inteligencia + Pericias (dif. 7), extendida y semanal.","ref":"Despojos de Guerra (EO:V), p. 34-35 (PDF)","r":"Tiradas del líder"}},"o":0},{"id":"e414","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Combate naval y barcos","lvl":0,"v":{"eov":{"t":"Tabla de barcos (barco vikingo, coca, galeras, tarida...) con velocidad, maniobra, tripulación, armas, absorción y niveles de salud; cada nivel de daño quita 1 a la velocidad y a la maniobra. Navegación, persecución (Astucia + Marinería cada 4 horas, dif. 7; la diferencia neta acerca o aleja 500 m por punto) y maniobras.","ref":"Despojos de Guerra (EO:V), p. 34-36 (PDF)","r":"Astucia/Inteligencia + Marinería"}},"o":0},{"id":"e415","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Armas y daño según la criatura","lvl":0,"v":{"eov":{"t":"Mortales: absorben el contundente con Resistencia y el letal solo con armadura. Lupinos: absorben el contundente y el letal, y el agravado salvo en forma homínida; la plata es especial. Cainitas: la mitad de daño por golpes y perforación (la estaca paraliza); absorben letal y contundente con Resistencia + Fortaleza + armadura y el agravado solo con Fortaleza. Lista ampliada de armas (espada bastarda, estoque...).","ref":"Despojos de Guerra (EO:V), p. 42-44 (PDF)"}},"o":0},{"id":"e416","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Venenos","lvl":0,"v":{"eov":{"t":"Identificar un veneno: Percepción + Medicina (dif. 7). Administrarlo: Inteligencia + Medicina (dif. 6 en la comida, 7 en una armadura, 8 al herir). Los Cainitas que beben sangre envenenada sufren efectos: la amanita produce alucinaciones y la cicuta, entumecimiento y lentitud.","ref":"Despojos de Guerra (EO:V), p. 53 (PDF)","r":"Percepción/Inteligencia + Medicina"}},"o":0},{"id":"e417","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Reclutar tropas, rescates y cruzados","lvl":0,"v":{"eov":{"t":"Reclutar fuerzas por encima de lo que da el derecho feudal: dif. 6 para una campaña corta, más cuanto más lejos. Rebelarse contra el propio señor es mucho más difícil. Rescates: un punto de Recursos durante un año para un rescate típico. Privilegios de quien toma la Cruz.","ref":"Despojos de Guerra (EO:V), p. 73-74 (PDF)","r":"Carisma o Manipulación + Comercio/Liderazgo/Expresión (dif. 6-9)"}},"o":0},{"id":"e418","cat":"Creación y sistemas","group":"Experiencia","title":"Puntos de envejecimiento e interludios","lvl":0,"v":{"eov":{"t":"Entre historias se ganan puntos de envejecimiento según los años y la actividad: de 1 a 5 años, uno por año, y menos a partir de ahí. En letargo solo con FV 7+, Percepción 4+ y 500 años de edad. Solo sirven para mejorar rasgos que ya se tienen (se pueden combinar con PX). Hay tiradas para mantener o perder Trasfondos durante largos periodos (Influencia dif. 8, Mentor dif. 7, Recursos dif. 8...).","ref":"Libro del Narrador, p. 64-68 (PDF)"}},"o":0},{"id":"e419","cat":"Senderos y Virtudes","group":"Caminos principales","title":"Via Diabolis (Camino del Diablo)","lvl":0,"v":{"veo1":{"t":"En la 1ª edición, camino de los Cainitas que se ven como demonios al servicio de un principio oscuro (Satán, dioses paganos, obsesiones...). Su ética exige sembrar la corrupción y el horror, y pone el orgullo por delante del servicio. Ni la traición ni el frenesí les hacen degenerar; sí dejar de servir a su causa. Incluye enfoques por Naturaleza y la Misa Negra. La jerarquía de pecados está en la p. 82, pero no se lee bien en el escaneo. En EO:V 2003 equivale al Sendero del Diablo del Camino del Pecado, y en VEO21 al Sendero de los Aullidos.","ref":"La Herejía Cainita (1ª ed.), p. 81-84 (PDF)"}},"o":0},{"id":"e420","cat":"Creación y sistemas","group":"Habilidades nuevas","title":"Conocimiento: Herético","lvl":0,"v":{"veo1":{"t":"Conocimiento de los ritos, señales, textos y teología de la Herejía Cainita y de otras herejías humanas. Además, la Posición dentro de la Herejía es un Trasfondo separado y secreto.","ref":"La Herejía Cainita (1ª ed.), p. 92 (PDF)","r":"Conocimiento 1-5"}},"o":0},{"id":"e421","cat":"Creación y sistemas","group":"Méritos y Defectos","title":"Méritos y Defectos herejes","lvl":0,"v":{"veo1":{"t":"Méritos: Confesor (el coste depende de la importancia del confesado), Biblioteca de Herejías (2), Icono Viviente (4: un pueblo de mortales te adora como a un santo), Milagros de Fe (5). Defectos: Hereje Conocido (2: +2 a las tiradas Sociales en territorio hostil), Devoción Fanática (3: FV dif. 7 para dejar tus devociones), Castigado por Dios (3).","ref":"La Herejía Cainita (1ª ed.), p. 92-94 (PDF)"}},"o":0,"sub":"La Herejía Cainita"},{"id":"e422","cat":"Disciplinas","group":"Animalismo","title":"Poderes Ma de los Anda","lvl":0,"v":{"veo1":{"t":"Técnicas mongolas que se consideran extensiones del Animalismo. Robar la Tremenda Velocidad (Animalismo 2, Fortaleza 1): corre como un pony de la estepa, 150 km o más en una noche, sin poder parar (Resistencia + Atletismo, dif. 6). Compartir Fuerza (Animalismo 3, Protean 2; 12 PX): con su sangre potencia a su montura durante tantos días como su Animalismo (doble velocidad, +1 a un Atributo, no puede ser descabalgado: +1 a Equitación y a Armas C.C. montado). El Abrazo de Ítigen (Animalismo 1, Protean 3; 10 PX): se entierra en la estepa con otro ser vinculado por sangre.","ref":"Vientos de Oriente (1ª ed.), p. 70-72 (PDF)","r":"Gratis para los Anda; los demás necesitan un Mentor Anda de 3 o más y pagar los PX"}},"o":0,"sub":"Poderes Ma (Anda)"},{"id":"e423","cat":"Creación y sistemas","group":"Méritos y Defectos","title":"Méritos y Defectos mongoles","lvl":0,"v":{"veo1":{"t":"Inofensivo para los Animales (Mérito, 1-2). Sentido del Ganado (Mérito, 3: con Percepción + Trato con Animales detecta que alguien no es humano). Repulsivo para los Animales (Defecto, 2: solo se les calma con Animalismo o sangre). Reglas de generación de los Anda (nunca por debajo de la 5ª; la mayoría, de la 9ª o más) y de los Trasfondos en la estepa.","ref":"Vientos de Oriente (1ª ed.), p. 69, 75-76 (PDF)"}},"o":0,"sub":"Vientos de Oriente"},{"id":"e424","cat":"Otros juegos (cruces)","group":"Wan Kuei (Vientos de Oriente)","title":"Rituales de la Tortuga Negra","lvl":0,"v":{"veo1":{"t":"Rituales de los vampiros orientales (Wan Kuei), para cruces con Sangre y Seda: Hablar a través de la Lengua del Dragón (1), Redirección (3, flechas que buscan el blanco), Fuerza de la Manada (3), Comunión con Tengri (4) y Comunión con Ítigen (4).","ref":"Vientos de Oriente (1ª ed.), p. 72-75 (PDF)"}},"o":0},{"id":"e425","cat":"Creación y sistemas","group":"Méritos y Defectos","title":"Méritos y Defectos caballerescos","lvl":0,"v":{"veo1":{"t":"Méritos: Cruzado (1), Orden Prestigiosa, Linaje Conocido. Defectos: Juramento Sagrado (1-3), Orden Fraudulenta (2), Desposeído (2: +1 a las tiradas Sociales ante caballeros con tierras), Caballero Bellaco (2: +1 a las tiradas Sociales ante nobles), Sin Virtud (2: +1), Mujer Disfrazada (4), Mujer con Espuelas (5). También trae un Trasfondo de Vasallaje en niveles.","ref":"El Caballero de Cenizas (1ª ed.), p. 100-104 (PDF)"}},"o":0,"sub":"El Caballero de Cenizas"},{"id":"e426","cat":"Creación y sistemas","group":"Creación de personaje","title":"Crear mortales y ghouls (sirvientes)","lvl":0,"v":{"veo1":{"t":"Personajes que sirven a un vampiro: se eligen el papel, el amo y el clan, y si es mortal, ghoul u otro ser. Atributos 6/4/3 y Habilidades 11/7/4 (máx. 3). Pueden tener los Trasfondos de los vampiros salvo Generación y Rebaño, además de Fe Verdadera y Magia Vulgar (Númenes).","ref":"Señor y Vasallo (1ª ed.), p. 60-61 (PDF)","r":"Atributos 6/4/3 · Habilidades 11/7/4"}},"o":0},{"id":"e427","cat":"Creación y sistemas","group":"Habilidades nuevas","title":"Magia Vulgar y Númenes (mortales)","lvl":0,"v":{"veo1":{"t":"Sendas de magia campesina para mortales: Adivinación, Curación, Encantamiento, Invocación/Atadura y Protección, Maldecir, Zahorí y otras, con rituales vinculados al nivel. Cada ritual lleva al menos un turno por nivel y algunos cuestan FV. Si falla, se repite con +1 a la dificultad. Con trabajo en equipo, cada ayudante con éxito resta 1 a la dificultad (mínimo 3).","ref":"Señor y Vasallo (1ª ed.), p. 81-92 (PDF)","r":"Atributo + Habilidad (normalmente Inteligencia + Ocultismo), dif. = nivel + 4"}},"o":0},{"id":"e428","cat":"Disciplinas","group":"Poderes combinados","title":"Piel de Oso (Animalismo 2, Protean 4)","lvl":0,"v":{"veo1":{"t":"Forma de oso berserker: +2 dados a todas las tiradas de Fuerza y Resistencia, también a la absorción (incluso contra la luz del sol). Dura mientras siga el frenesí.","ref":"Lobos Marinos (1ª ed.), p. 72 (PDF)","r":"Solo en frenesí; 1 punto de sangre; 18 PX"}},"o":0,"sub":"Lobos Marinos"},{"id":"e429","cat":"Disciplinas","group":"Poderes combinados","title":"Garras de Fenrir (Fortaleza 2, Protean 2)","lvl":0,"v":{"veo1":{"t":"Garras de 15 cm casi indestructibles: daño Fuerza + 3 agravado, y atraviesan armaduras y muros. -2 dados a las tareas de Destreza fina mientras las lleva.","ref":"Lobos Marinos (1ª ed.), p. 72-73 (PDF)","r":"Al activar Garras de la Bestia; 12 PX"}},"o":0,"sub":"Lobos Marinos"},{"id":"e430","cat":"Disciplinas","group":"Poderes combinados","title":"Hibernación (Animalismo 4, Fortaleza 2)","lvl":0,"v":{"veo1":{"t":"Cada éxito conserva un punto de sangre durante el letargo, que tiene al despertar.","ref":"Lobos Marinos (1ª ed.), p. 73 (PDF)","r":"Al entrar en letargo voluntario; Resistencia + Supervivencia (dif. 8); 18 PX"}},"o":0,"sub":"Lobos Marinos"},{"id":"e431","cat":"Senderos y Virtudes","group":"Caminos principales","title":"Via Aesirgard (Camino de los dioses nórdicos)","lvl":0,"v":{"veo1":{"t":"Camino religioso de los vampiros escandinavos, parecido al Camino del Cielo pero con la moral vikinga: honrar a los dioses y las sagas, combatir a jotuns y trolls, aborrecer la cobardía y la mentira. Virtudes: Autocontrol y Convicción. No existe en EO:V 2003 ni en VEO21.","ref":"Lobos Marinos (1ª ed.), p. 73-74 (PDF)"}},"o":0,"h":{"veo1":["No mostrar respeto a los dioses o a los hombres de piadosa sabiduría.","No manifestarse en contra de la cobardía, la traición, el deshonor, etc.","Seguir motivaciones como la compasión, la gula (de sangre) o el miedo.","Robar, mentir o engañar a amigos o aliados.","Causar daño a personas pías o devotas (según los estándares vikingos).","Alimentarse de una persona devota sin su permiso.","Actos heréticos o blasfemos (profanar una imagen de Thor u Odín, apoyar al dios cristiano).","Permitir que un crimen, una traición o un deshonor quede sin castigo.","Cometer un asesinato a escondidas o traicionar a unos aliados.","Ayudar a un demonio, troll, jotun u otro ser sobrenatural al servicio del mal."]}},{"id":"e432","cat":"Creación y sistemas","group":"Méritos y Defectos","title":"Méritos y Defectos nórdicos","lvl":0,"v":{"veo1":{"t":"Experto en Proverbios (2), Fiereza Audaz (2: en lugar de Rötschreck puedes entrar en frenesí, pero sin poder usar FV para controlarlo), Valkiria (2), Afinidad Lupina (3/5/7), Presciencia (4), Sabio Rúnico (5: magia rúnica de sangre con las sendas de magia vulgar), Berserker Auténtico (5: +2 a Fuerza, +1 a Resistencia, 3 niveles de salud extra y -2 a las penalizaciones por heridas durante la escena). Además, el Trasfondo Fama (1-5).","ref":"Lobos Marinos (1ª ed.), p. 72-78 (PDF)"}},"o":0,"sub":"Lobos Marinos"},{"id":"e433","cat":"Creación y sistemas","group":"Guerra y batallas","title":"Navegación nórdica y tormentas","lvl":0,"v":{"veo1":{"t":"Reglas de viaje por mar, navegación, polizones y una tabla de dificultades por la violencia de la tormenta, además del combate en un hall (incluida su quema).","ref":"Lobos Marinos (1ª ed.), p. 34, 84-86 (PDF)"}},"o":0},{"id":"e434","cat":"Creación y sistemas","group":"Facciones y sociedad","title":"Los Furores (rebeldes)","lvl":0,"v":{"veo1":{"t":"Suplemento de ambientación sobre los Furores, los Cainitas jóvenes que se rebelan contra los antiguos (precursores de los Anarquistas). Trae sus motivaciones, comunidades como Nueva Lacedemonia, consejos para crónicas de rebelión y personajes de ejemplo. Casi no añade reglas.","ref":"Ladrón de Cenizas (1ª ed.), p. 70-95 (PDF)"}},"o":0},{"id":"e435","cat":"Creación y sistemas","group":"Facciones y sociedad","title":"Los Tres Pilares (sociedad medieval)","lvl":0,"v":{"veo1":{"t":"Guía de ambientación sobre los tres órdenes medievales (los que rezan, los que luchan y los que trabajan) y cómo encajan en ellos los Cainitas: la Iglesia (cargos, órdenes monásticas, obispos), la nobleza y el campesinado, con semillas de historia. No tiene reglas nuevas relevantes.","ref":"Tres Pilares (1ª ed.)"}},"o":0},{"id":"e436","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Virtudes: Conciencia/Convicción, Autocontrol/Instinto y Coraje","lvl":0,"v":{"eov":{"t":"Cada camino usa dos Virtudes más Coraje. Conciencia (moral aceptada de la sociedad) o Convicción (código elegido por uno mismo) se tira para resistir la degeneración. Autocontrol (contener la Bestia) o Instinto (cabalgar el frenesí) se tira contra el frenesí. Coraje se tira contra el Rötschreck. Si la reserva de sangre es menor que el Autocontrol, se tira solo un dado por punto de sangre.","ref":"Edad Oscura: Vampiro, p. 158-160"},"veo21":{"t":"Igual que en EO:V 2003, con el mismo texto.","ref":"VEO21, p. 292-294","same":"eov"}},"o":0},{"id":"e437","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Valor de Camino (1-10) y sus efectos","lvl":0,"v":{"eov":{"t":"Valor inicial = suma de las dos Virtudes del camino. Se tiran como máximo tantos dados de una Virtud como el valor de Camino. Cuanto más alto el Camino, antes despierta el vampiro; durante el día, su reserva máxima es igual al Camino. También fija la duración del letargo y la intensidad del aura. Con Camino 0, el personaje pasa al Narrador.","ref":"Edad Oscura: Vampiro, p. 160-161"},"veo21":{"t":"Igual que en EO:V 2003.","ref":"VEO21, p. 295-296","same":"eov"}},"o":0},{"id":"e438","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Modificador de aura según el Camino","lvl":0,"v":{"eov":{"t":"Camino 10: -2 a la dificultad; 9-8: -1; 7-4: sin modificador; 3-2: +1; 1: +2. Se aplica a las tiradas Sociales relacionadas con el aura del camino, también las de Disciplinas. Los iniciados todavía no proyectan aura.","ref":"Edad Oscura: Vampiro, p. 161"},"veo21":{"t":"Misma tabla. Además, un excomulgado duplica cualquier penalización de su aura.","ref":"VEO21, p. 296 y 181","same":"eov"}},"o":0},{"id":"e439","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Iniciado, Devoto, Virtuoso, Apóstata","lvl":0,"v":{"eov":{"t":"Descripción narrativa sin valores numéricos. Iniciado: aún sin momento de verdad, sin aura y con +1 a la dificultad contra el frenesí y el Rötschreck. Devoto: tras un momento de verdad. Maestros y sacerdotes cenicientos. Virtuosos: casi santos.","ref":"Edad Oscura: Vampiro, p. 95-97"},"veo21":{"t":"Añade valores de juego. Iniciado: Camino 1-3. Devoto: Camino 4-7 (la mayoría). Virtuoso: Camino 8 o más. Apóstata: quien cambia de camino o ha cometido públicamente un pecado de nivel 1.","ref":"VEO21, p. 179-181"}},"o":0},{"id":"e440","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Excomunión","lvl":0,"v":{"eov":{"t":"Solo narrativa: los maestros pueden declarar anatema a un devoto, que queda aislado del camino y suele degenerar.","ref":"Edad Oscura: Vampiro, p. 97"},"veo21":{"t":"Regla nueva: un Virtuoso puede excomulgar a un Iniciado; para excomulgar a un Devoto hacen falta tres Virtuosos; a un Virtuoso no se le excomulga, se le destruye o expulsa. El excomulgado tiene +2 a la dificultad de Conciencia/Convicción y duplica su penalización de aura.","ref":"VEO21, p. 181"}},"o":0},{"id":"e441","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Aprender de un maestro (coste de PX del Camino)","lvl":0,"v":{"eov":{"t":"Estudiar con un maestro durante tantos meses como el valor de Camino actual provoca un momento de verdad, que permite gastar PX en el Camino. No hay descuento.","ref":"Edad Oscura: Vampiro, p. 266"},"veo21":{"t":"Además, con un maestro de Camino más alto, el coste en PX se reduce en 1 por cada punto de diferencia, hasta la mitad del coste normal. Ejemplo: de 5 a 6 cuesta 9 PX en vez de 12 con un maestro de Camino 8.","ref":"VEO21, p. 180"}},"o":0},{"id":"e442","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Momentos de verdad","lvl":0,"v":{"eov":{"t":"Sin tirada. Se producen al cometer un pecado de nivel 1-3 (se degenere o no), al entrar en frenesí sin degenerar, al estudiar con un maestro (meses = Camino), por un hecho trascendente o por arrepentirse tras degenerar. Son necesarios para pasar de iniciado a devoto y para gastar PX en el Camino.","ref":"Edad Oscura: Vampiro, p. 266"},"veo21":{"t":"Igual que en EO:V 2003.","ref":"VEO21, p. 183","same":"eov"}},"o":0},{"id":"e443","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Degeneración","lvl":0,"v":{"eov":{"t":"Pecar según la jerarquía del Camino actual obliga a tirar Conciencia/Convicción (dif. 6, +1 si se descuidan los ritos del camino). No se puede gastar FV. Si falla, pierde 1 punto de Camino; si fracasa, pierde además 1 de Conciencia/Convicción y gana un trastorno.","ref":"Edad Oscura: Vampiro, p. 267"},"veo21":{"t":"Igual que en EO:V 2003.","ref":"VEO21, p. 184","same":"eov"}},"o":0},{"id":"e444","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Cambiar de camino","lvl":0,"v":{"eov":{"t":"Un año de estudio con un maestro del nuevo camino. Hay que bajar el Camino antiguo a 3 o menos (mínimo 1) pecando contra él sin pecar contra el nuevo, y bajar a 1 las Virtudes que no correspondan. Después, una prueba y una tirada de FV (dif. 4 + Camino actual, +1 por Virtud a cambiar). Un iniciado solo necesita tres meses, bajar las Virtudes y FV (dif. 6).","ref":"Edad Oscura: Vampiro, p. 267"},"veo21":{"t":"Igual que en EO:V 2003. Además, antes de elegir camino, el neonato sigue de forma instintiva el Camino de la Humanidad.","ref":"VEO21, p. 178, 182-183","same":"eov"}},"o":0},{"id":"e445","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Cambiar a un camino menor o de clan","lvl":0,"v":{"ldn":{"t":"Más estricto que con los caminos mayores: al menos dos años de estudio con un tutor, a veces con sacrificios. Hay que bajar el Camino antiguo a 3 y vivir ya según la ética del nuevo. Los forasteros al clan lo tienen más difícil.","ref":"Libro del Narrador, p. 23 (PDF)"},"veo21":{"t":"No trae una regla específica: los Caminos de clan se tratan como los demás.","ref":"VEO21, p. 219"}},"o":0},{"id":"e446","cat":"Senderos y Virtudes","group":"Reglas de Caminos","title":"Golconda","lvl":0,"v":{"eov":{"t":"Sin sistema fijo. Leyendas: aceptación, calma (inmune al frenesí y al Rötschreck), fuerza (rasgos hasta 10 sin límite por generación), hambre (1 punto de sangre por semana) y quizá volver a ser mortal.","ref":"Edad Oscura: Vampiro, p. 266"},"veo21":{"t":"Igual que en EO:V 2003. El Sendero de la Iluminación la convierte en su objetivo.","ref":"VEO21, p. 185, 205","same":"eov"}},"o":0},{"id":"e447","cat":"Senderos y Virtudes","group":"Frenesí y Rötschreck","title":"Frenesí","lvl":0,"v":{"eov":{"t":"Con Autocontrol se lucha contra la Bestia: hacen falta 5 éxitos acumulados; cada turno de aplazamiento gasta uno. Contra la tentación se puede usar dif. 9 - Conciencia. Con Instinto se cabalga: entra en frenesí salvo que la dificultad sea menor que su Instinto (+1 FV sube el Instinto en uno), y dirige sus acciones con tiradas de Instinto. Dificultades: oler sangre con hambre 3+, verla 4+, hostigamiento 4, peligro 4, burlas 4, provocación física 6, probar sangre 6+, ser querido en peligro 7, humillación 8; +1 con fuego cerca y +1 si es iniciado.","ref":"Edad Oscura: Vampiro, p. 263-264"},"veo21":{"t":"Mismas reglas y tabla. Añade un recuadro de interpretación del frenesí.","ref":"VEO21, p. 607-608","same":"eov"}},"o":0},{"id":"e448","cat":"Senderos y Virtudes","group":"Frenesí y Rötschreck","title":"Rötschreck (Miedo Rojo)","lvl":0,"v":{"eov":{"t":"Se tira Coraje; hacen falta 5 éxitos acumulados, como en el frenesí. Si falla, huye sin control; si fracasa, entra en frenesí contra la fuente del peligro. Dificultades: encender una vela 3, antorcha 5, hoguera 6, luz solar velada 7, quemarse 7, sol directo 8, atrapado en un incendio 8; +1 si es iniciado.","ref":"Edad Oscura: Vampiro, p. 265"},"veo21":{"t":"Igual que en EO:V 2003.","ref":"VEO21, p. 609","same":"eov"}},"o":0},{"id":"e449","cat":"Creación y sistemas","group":"Creación de personaje","title":"Resumen de creación","lvl":0,"v":{"eov":{"t":"Atributos 7/5/3 (todos empiezan en 1). Habilidades 13/9/5 (máx. 3). Disciplinas de clan: 4. Trasfondos: 5. Virtudes: 7 (además de 1 gratis en cada Virtud del camino y en Coraje). Camino = suma de las Virtudes del camino. FV = Coraje. Reserva de sangre inicial: 1 dado + Dominio + Rebaño. 15 puntos gratuitos.","ref":"Edad Oscura: Vampiro, p. 128-129"},"veo21":{"t":"Igual que en EO:V 2003. Añade modelos de concepto medieval.","ref":"VEO21, p. 252","same":"eov"}},"o":0},{"id":"e450","cat":"Creación y sistemas","group":"Creación de personaje","title":"Coste de los puntos gratuitos","lvl":0,"v":{"eov":{"t":"Atributo 5, Habilidad 2, Disciplina 7, Trasfondo 1, Virtud 2, Camino 1, Fuerza de Voluntad 1.","ref":"Edad Oscura: Vampiro, p. 129"},"veo21":{"t":"Los mismos, y añade Especialidades a 1 punto cada una (máx. 3 por Habilidad).","ref":"VEO21, p. 252","same":"eov"}},"o":0},{"id":"e451","cat":"Creación y sistemas","group":"Experiencia","title":"Costes de experiencia","lvl":0,"v":{"eov":{"t":"Atributo: actual x4. Habilidad: actual x2. Nueva Habilidad: 3. Especialidad: valor actual. Disciplina de clan: actual x5. Otra Disciplina: actual x7. Nueva Disciplina: 10. Senda secundaria (Taumaturgia/Mortis): actual x4. Virtud: actual x2. Camino: actual x2. FV: valor actual.","ref":"Edad Oscura: Vampiro, p. 166"},"veo21":{"t":"Igual (las sendas secundarias son de Taumaturgia/Nigromancia). Ver también el descuento por maestro en el Camino.","ref":"VEO21, p. 303","same":"eov"}},"o":0},{"id":"e452","cat":"Creación y sistemas","group":"Generación","title":"Tabla de generación","lvl":0,"v":{"eov":{"t":"Rasgo máx. / reserva / sangre por turno. 4ª: 9/50/10. 5ª: 8/40/8. 6ª: 7/30/6. 7ª: 6/20/4. 8ª: 5/15/3. 9ª: 5/14/2. 10ª: 5/13/1. 11ª: 5/12/1. 12ª: 5/11/1. 13ª o más: 5/10/1.","ref":"Edad Oscura: Vampiro, p. 164"},"veo21":{"t":"La misma tabla.","ref":"VEO21, p. 300","same":"eov"}},"o":0},{"id":"e453","cat":"Creación y sistemas","group":"Disciplinas: reglas","title":"Disciplinas de nivel 6 o más","lvl":0,"v":{"eov":{"t":"El libro describe un único poder de nivel 6 por Disciplina y no da reglas para elegir entre varios. Las sendas de hechicería no pasan de 5, ni siquiera por debajo de la 8ª generación.","ref":"Edad Oscura: Vampiro, cap. 6 y p. 171"},"veo21":{"t":"Para 7ª generación o inferior: se puede aprender más de un poder por cada nivel por encima de 5, con varios ejemplos por nivel (hasta el 9). En Celeridad, Fortaleza y Potencia se elige entre el efecto estándar o un poder especial, y no se puede subir el estándar sin haberlo cogido en el nivel anterior.","ref":"VEO21, p. 310-311"}},"o":0},{"id":"e454","cat":"Creación y sistemas","group":"Disciplinas: reglas","title":"Secretos de clan (regla opcional)","lvl":0,"v":{"eov":{"t":"Sin enseñanza solo se suben las Disciplinas físicas y las de clan. Hay que beber la sangre de un maestro del clan y recibir instrucción: el primer punto cuesta 10 PX y después actual x7. Robada sin instrucción, 20 PX y actual x14.","ref":"Edad Oscura: Vampiro, p. 170"},"veo21":{"t":"Igual. Añade que los poderes elevados ligados a un clan o línea de sangre son muy difíciles de aprender fuera de ella.","ref":"VEO21, p. 310","same":"eov"}},"o":0},{"id":"e455","cat":"Creación y sistemas","group":"Disciplinas: reglas","title":"Fracaso en una tirada de Disciplina","lvl":0,"v":{"eov":{"t":"Sin regla general: cada poder indica su propio fracaso.","ref":"Edad Oscura: Vampiro, cap. 6"},"veo21":{"t":"Regla nueva: con un fracaso la Bestia se desboca y el Narrador describe un efecto destructivo; el poder puede funcionar, pero con un coste alto.","ref":"VEO21, p. 310"}},"o":0},{"id":"e456","cat":"Creación y sistemas","group":"Disciplinas: reglas","title":"Hechicería de la sangre: sendas y rituales","lvl":0,"v":{"eov":{"t":"Taumaturgia y Mortis: se elige una senda primaria, que sube con la Disciplina. Las secundarias se compran aparte (actual x4) y no pueden superar a la primaria hasta que esta llegue a 5. Los rituales (niveles 1-5/6) no cuestan PX: basta con una semana de estudio por nivel.","ref":"Edad Oscura: Vampiro, p. 171"},"veo21":{"t":"Igual. Mortis pasa a llamarse Nigromancia y se añaden las hechicerías Assamita, Koldúnica y Setita y el Misticismo Abismal.","ref":"VEO21, p. 439","same":"eov"}},"o":0},{"id":"e457","cat":"Creación y sistemas","group":"Clanes","title":"Disciplinas de clan","lvl":0,"v":{"eov":{"t":"Brujah: Celeridad, Potencia, Presencia. Capadocios: Auspex, Fortaleza, Mortis. Lasombra: Dominación, Obtenebración, Potencia. Toreador: Auspex, Celeridad, Presencia. Tzimisce: Animalismo, Auspex, Vicisitud. Ventrue: Dominación, Fortaleza, Presencia. Assamitas: guerreros (Celeridad, Ofuscación, Extinción), hechiceros (Hechicería Assamita o Taumaturgia, Auspex, Extinción) o visires (Auspex, Celeridad, Extinción). Gangrel: Animalismo, Fortaleza, Protean. Malkavian: Auspex, Dementación, Ofuscación. Nosferatu: Animalismo, Ofuscación, Potencia. Ravnos: Animalismo, Fortaleza, Quimerismo. Seguidores de Set: Ofuscación, Presencia, Serpentis. Tremere: Auspex, Dominación, Taumaturgia.","ref":"Edad Oscura: Vampiro, cap. 2 (p. 62-93)"},"ldn":{"t":"Líneas de sangre oficiales (EO:V): Gárgolas, Laibon/Akunanse (Abombwe), Lamiae (senda de los Cuatro Humores), Lhiannan (Ogham), Salubri (Valeren), Baali (Daimonion)...","ref":"Libro del Narrador, cap. 1 (p. 8-20 PDF)"},"veo21":{"t":"Los mismos clanes (los Capadocios con Nigromancia en lugar de Mortis), y además líneas de sangre jugables: Akunanse (Abombwe, Animalismo, Fortaleza), Anda (Animalismo, Fortaleza, Protean), Baali (Daimonion, Ofuscación, Presencia), Gárgolas (Vuelo, Fortaleza, Potencia), Hijos de Osiris (Bardo + 2 del clan original), Lamiae (Fortaleza, Nigromancia, Potencia), Lhiannan (Animalismo, Ogham, Presencia), Nagaraja (Auspex, Dominación, Nigromancia), Noiad (Animalismo, Auspex, Protean), Salubri curandero o guerrero (Auspex, Fortaleza, Valeren), Telyavos (Auspex, Presencia, Taumaturgia)...","ref":"VEO21, cap. 2 (p. 75-165)","same":"eov"}},"o":0},{"id":"e458","cat":"Otros juegos (cruces)","group":"Edad Oscura: Hadas","title":"Beber sangre de hada","lvl":0,"v":{"eov":{"t":"Los inanimae no tienen sangre (beber de uno de agua o de fuego tiene sus consecuencias). La sangre de changeling da efectos mientras dure en el cuerpo, y la de un primonato los dobla. Verano: +2 dados para absorber la luz y el fuego, pero el vampiro brilla y causa 1 nivel letal por turno a otros vampiros. Primavera: +1 Carisma con buen ánimo, pero +1 a la dificultad contra el frenesí. Otoño: lee pensamientos superficiales como Auspex 4, pero oye todas las mentes en 4,5 m (1 FV por escena para concentrarse). Invierno: +1 a un Atributo Físico, pero la sangre bebida solo rinde la mitad. Solsticio: sin efecto.","ref":"Edad Oscura: Hadas, p. 180-181"}},"o":0},{"id":"e459","cat":"Otros juegos (cruces)","group":"Edad Oscura: Hadas","title":"Disciplinas contra hadas","lvl":0,"v":{"eov":{"t":"Las hadas con los Dominios del Día o de la Noche resisten las Disciplinas mentales (Dominación, Presencia): no funcionan contra un hada con un nivel de Dominio igual o mayor que el de la Disciplina. Las Disciplinas físicas (Mortis, Vicisitud) funcionan con normalidad, pero los inanimae pueden volver a su forma elemental y anularlas.","ref":"Edad Oscura: Hadas, p. 181"}},"o":0},{"id":"e460","cat":"Otros juegos (cruces)","group":"Edad Oscura: Hadas","title":"Nieblas y Camino de la Humanidad","lvl":0,"v":{"eov":{"t":"Los Cainitas del Camino de la Humanidad son más vulnerables a las Nieblas feéricas: con un Pródigo, el hada solo necesita gastar 1 punto de Otorgar Saber.","ref":"Edad Oscura: Hadas, p. 181"}},"o":0},{"id":"e461","cat":"Otros juegos (cruces)","group":"Edad Oscura: Mago","title":"Los Tremere vistos por los magos","lvl":0,"v":{"eov":{"t":"Solo trasfondo, sin reglas para vampiros. Tremere y su Casa se convirtieron en no muertos tras experimentar con vampiros (1022) y perdieron la magia hermética. La Orden de Hermes los declaró proscritos y luchó contra ellos en la Guerra Massasa. Ceoris, su capilla de los Cárpatos, está asediada por los vampiros y en guerra a tres bandas con lupinos y magos. Incluye una semilla de crónica en la que la Orden negocia una alianza contra los Tremere con otros clanes (Tzimisce, Gangrel, Nosferatu).","ref":"Edad Oscura: Mago, p. 34, 120 y 173 (PDF)"}},"o":0},{"id":"e462","cat":"Otros juegos (cruces)","group":"Edad Oscura: Mago","title":"Creación de personaje comparada","lvl":0,"v":{"eov":{"t":"Usa la misma estructura que EO:V (Atributos 7/5/3, Habilidades 13/9/5, 5 Trasfondos y 15 puntos gratuitos), pero cambia las Virtudes y el Camino por el Fundamento (1), tres puntos de Pilares, Fuerza de Voluntad 5 y Quintaesencia.","ref":"Edad Oscura: Mago, p. 58-62 (PDF)"}},"o":0}],"generated":"2026-11-06"}</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const ED=DATA.editions, E=DATA.entries;
const EDMAP=Object.fromEntries(ED.map(e=>[e.id,e]));
const CATS=["Disciplinas","Senderos y Virtudes","Creación y sistemas","Otros juegos (cruces)","Fuentes"].filter(c=>c==="Fuentes"||E.some(e=>e.cat===c));
const store={get(k,d){try{const v=localStorage.getItem('codice.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('codice.'+k,JSON.stringify(v))}catch(e){}}};
let S={mine:store.get('mine','eov'),only:store.get('only',false),pending:store.get('pending',false),cat:store.get('cat','Disciplinas'),group:store.get('group',null),q:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// "ldn" versions belong to edition eov
function verFor(e,ed){ if(ed==='eov'){ return e.v.eov||e.v.ldn||null } return e.v[ed]||null }
function srcLabel(e,ed){ if(ed==='eov' && !e.v.eov && e.v.ldn) return 'Libro del Narrador'; return '' }
function visibleEds(){ let eds=ED.filter(x=>x.status==='cargado'||S.pending); if(S.only) eds=eds.filter(x=>x.id===S.mine); if(!eds.length) eds=[EDMAP[S.mine]]; return eds }

function renderEdPick(){
  const box=$('#edpick'); box.querySelectorAll('.chip').forEach(n=>n.remove());
  ED.forEach(ed=>{const b=document.createElement('button');b.className='chip'+(ed.status==='cargado'?' loaded':'')+(ed.fan?' fan':'');b.type='button';
    b.setAttribute('aria-pressed',S.mine===ed.id);b.title=ed.name+' · '+ed.pub+(ed.status!=='cargado'?' · manual pendiente':'');
    b.innerHTML='<span class="dot"></span>'+esc(ed.short);b.onclick=()=>{S.mine=ed.id;store.set('mine',ed.id);if(ed.status!=='cargado'&&!S.pending){S.pending=true;$('#showPending').checked=true;store.set('pending',true)}render()};box.appendChild(b)});
}
function renderCats(){
  const nav=$('#cats');nav.innerHTML='';
  CATS.forEach(c=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${CATICON[c]||''}</svg>`+esc(c);b.setAttribute('aria-current',!S.q&&S.cat===c);b.onclick=()=>{S.cat=c;S.group=null;S.q='';$('#q').value='';store.set('cat',c);render();window.scrollTo(0,0)};nav.appendChild(b)});
}
function groupsOf(cat){
  const m=new Map(); E.filter(e=>e.cat===cat).forEach(e=>m.set(e.group,(m.get(e.group)||0)+1));
  let g=[...m.entries()];
  if(cat==='Disciplinas'){
    const core=['Animalismo','Auspex','Celeridad','Dementación','Dominación','Extinción','Fortaleza','Mortis/Nigromancia','Obtenebración','Ofuscación','Potencia','Presencia','Protean','Quimerismo','Serpentis','Taumaturgia','Vicisitud'];
    const a=g.filter(x=>core.includes(x[0])).sort((x,y)=>x[0].localeCompare(y[0],'es'));
    const b=g.filter(x=>!core.includes(x[0])).sort((x,y)=>x[0].localeCompare(y[0],'es'));
    return [{h:'Disciplinas comunes',items:a},{h:'Líneas de sangre y hechicerías',items:b}];
  }
  if(cat==='Senderos y Virtudes'){
    const order=['Reglas de Caminos','Frenesí y Rötschreck','Caminos principales','Senderos','Caminos de clan (menores)'];
    g.sort((x,y)=>order.indexOf(x[0])-order.indexOf(y[0]));return [{h:'',items:g}];
  }
  return [{h:'',items:g}];
}
function renderIdx(){
  const idx=$('#idx'),sel=$('#idxsel');idx.innerHTML='';sel.innerHTML='';
  if(S.q||S.cat==='Fuentes'){idx.hidden=true;sel.hidden=true;return} idx.hidden=false;sel.hidden=false;
  const gs=groupsOf(S.cat); const all=gs.flatMap(x=>x.items.map(i=>i[0]));
  if(!all.includes(S.group)) S.group=all[0];
  gs.forEach(sec=>{ if(sec.h){const h=document.createElement('h3');h.textContent=sec.h;idx.appendChild(h);const og=document.createElement('optgroup');og.label=sec.h;sel.appendChild(og)}
    sec.items.forEach(([name,n])=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-current',name===S.group);b.innerHTML=esc(name)+'<span class="n">'+n+'</span>';
      b.onclick=()=>{S.group=name;store.set('group',name);render();window.scrollTo(0,0)};idx.appendChild(b);
      const o=document.createElement('option');o.value=name;o.textContent=name+' ('+n+')';o.selected=name===S.group;(sel.lastElementChild&&sel.lastElementChild.tagName==='OPTGROUP'?sel.lastElementChild:sel).appendChild(o)})});
  sel.onchange=()=>{S.group=sel.value;store.set('group',sel.value);render()};
}
const dots=n=>n>0?('•'.repeat(Math.min(n,5))+(n>5?' '+'•'.repeat(n-5):'')):'';
function hl(t){ if(!S.q) return esc(t); const q=fold(S.q).trim(); if(q.length<2) return esc(t);
  const s=String(t), f=fold(s); let out='',i=0,k; while((k=f.indexOf(q,i))>=0){out+=esc(s.slice(i,k))+'<mark>'+esc(s.slice(k,k+q.length))+'</mark>';i=k+q.length} return out+esc(s.slice(i)) }
function entryHTML(e){
  const eds=visibleEds().filter(ed=>!(ed.partial&&!verFor(e,ed.id)&&ed.id!==S.mine));
  const hasEov=!!verFor(e,'eov')||!!e.v.veo1, hasVeo=!!e.v.veo21;
  let tags='';
  if(hasEov && !hasVeo) tags+='<span class="etag ofi">Solo oficial</span>';
  if(!hasEov && hasVeo) tags+='<span class="etag">Solo VEO21</span>';
  if(hasEov && hasVeo && !e.v.veo21.same && e.cat!=='Disciplinas') tags+='<span class="etag diff">Cambia entre ediciones</span>';
  const ttl=e.title==='(Disciplina)'?'Descripción general':(e.title);
  let h=`<article class="entry" id="${e.id}"><div class="etitle">${e.lvl>0?`<span class="dots" title="Nivel ${e.lvl}">${dots(e.lvl)}</span>`:''}<h4>${hl(ttl)}</h4>${S.q?`<span class="etag ofi">${esc(e.cat)} · ${esc(e.group)}${e.sub?' · '+esc(e.sub):''}</span>`:''}${tags}</div>`;
  h+=`<div class="cols" style="--n:${eds.length}">`;
  eds.forEach(ed=>{
    const v=verFor(e,ed.id), mine=ed.id===S.mine;
    if(!v){ h+=`<div class="col none${mine?' mine':''}"><div class="ed">${esc(ed.short)}</div><p>${ed.partial?'Sin datos: de esta edición solo hay suplementos, falta el básico.':(ed.status==='cargado'?'No aparece en esta edición.':'Manual aún no cargado.')}</p></div>`; return }
    const src=srcLabel(e,ed.id);
    h+=`<div class="col${mine?' mine':''}"><div class="ed"><span>${esc(ed.short)}</span>${src?`<span class="src">${src}</span>`:''}</div>`;
    if(v.r) h+=`<div class="roll">${hl(v.r)}</div>`;
    h+=`<p class="${v.same?'same':''}">${hl(v.t)}</p>`;
    const hier=e.h&&e.h[ed.id];
    if(hier){ const other=ed.id==='veo21'?(e.h.eov):(e.h.veo21);
      h+=`<ol class="hier" aria-label="Jerarquía de pecados">`+hier.map((s,i)=>`<li class="${other&&other[i]&&fold(other[i]).replace(/\W/g,'')!==fold(s).replace(/\W/g,'')?'chg':''}"><b>${10-i}</b><span>${hl(s)}</span></li>`).join('')+`</ol>`}
    h+=`<div class="ref">${esc(v.ref)}</div></div>`;
  });
  return h+'</div></article>';
}

 "Reglas de Caminos":"path","Frenesí y Rötschreck":"fire2","Caminos principales":"cross","Senderos":"path","Caminos de clan (menores)":"crown","Guerra y batallas":"sword","Méritos y Defectos":"star","Habilidades nuevas":"quill","Facciones y sociedad":"crown","Creación de personaje":"quill","Experiencia":"hourglass","Generación":"drop","Clanes":"shield","Disciplinas: reglas":"book"};
const sigil=g=>`<span class="sigil" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${G[SIG[g]]||G.drop}</svg></span>`;
const WHISPERS=["La noche es larga y la sangre, escasa: elige bien tus dones.","Cada poder tiene un precio; la Bestia siempre cobra.","Los antiguos recuerdan cada regla que olvidaste.","Que la vela no se apague antes del alba.","El Narrador ve más de lo que tu sire te contó.","Un Camino se pierde de punto en punto, y se recupera de siglo en siglo.","Bajo la Cruz y bajo la luna, la sangre manda.","Ningún príncipe perdona un dado mal tirado.","Lee la página antes de jurar por la regla.","Hasta la Bestia respeta a quien conoce su jerarquía.","El sol no negocia: el Rötschreck tampoco.","La sangre de Caín es antigua; sus reglas, cambiantes."];
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function scene(seed){
  const r=n=>{seed=(seed*9301+49297)%233280;return seed/233280*n};
  let stars='';for(let i=0;i<26;i++){stars+=`<circle cx="${r(1000).toFixed(0)}" cy="${r(70).toFixed(0)}" r="${(r(1.2)+.3).toFixed(1)}" fill="var(--moon)" opacity="${(r(.6)+.25).toFixed(2)}"/>`}
  const mx=(720+r(220)).toFixed(0);
  return `<svg class="scene" viewBox="0 0 1000 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${stars}
  <circle cx="${mx}" cy="36" r="22" fill="var(--moon)"/><circle cx="${+mx+9}" cy="31" r="20" fill="var(--sky1)" opacity=".35"/>
  <g fill="var(--hill)">
   <path d="M0 140V112c60-8 120-20 190-18s120 14 190 10 110-22 180-24 130 16 200 14 120-14 240-6V140z" opacity=".55"/>
   <path d="M0 140v-14c90-10 180-8 260-4h20v-30h8v-10l8-8 8 8v10h8v22h18V86l10-14 10 14v28h16v-20h6v-8l6-6 6 6v8h6v28c80 4 200 2 300-6 120-8 230-4 330 6V140z"/>
   <path d="M818 140v-46l4-10 4 10v-8h6v-12l5-9 5 9v12h6v8l4-10 4 10v46z"/>
  </g>
  <g fill="var(--hill)">
   <path class="bat" d="M140 40c4-4 8-4 10 0 2-3 4-3 5 0 1-3 3-3 5 0 2-4 6-4 10 0-4 0-7 2-8 5-2-2-4-2-7 0-3-2-5-2-7 0-1-3-4-5-8-5z"/>
   <path class="bat b2" d="M560 26c3-3 6-3 8 0 1-2 3-2 4 0 1-2 2-2 4 0 2-3 5-3 8 0-3 0-5 2-6 4-2-2-3-2-6 0-2-2-4-2-6 0-1-2-3-4-6-4z" transform="scale(.9) translate(60 4)"/>
  </g></svg>`;
}
const finSVG='<div class="fin" aria-hidden="true"><svg viewBox="0 0 120 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 12h40M76 12h40"/><path d="M60 4c-4 4-6 6-6 8.5a6 6 0 0 0 12 0C66 10 64 8 60 4z" fill="currentColor" stroke="none" opacity=".8"/><circle cx="48" cy="12" r="1.5" fill="currentColor"/><circle cx="72" cy="12" r="1.5" fill="currentColor"/></svg></div>';
const waxSVG='<svg class="wax" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 2l3 3h4l1 4 3 3-2 4 1 4-4 2-1 4h-4l-3 3-3-3H8l-1-4-4-2 1-4-2-4 3-3 1-4h4z" fill="var(--accent)" opacity=".85"/><text x="15" y="19" text-anchor="middle" font-family="IM Fell English SC, Georgia, serif" font-size="11" fill="var(--panel)">C</text></svg>';
function headBlock(title,intro,g){
  return `<div class="nocturne">${scene(hash(g||title))}<div class="ghead">${g!==null?sigil(g):''}<div><h2>${esc(title)}</h2>${intro?`<p>${intro}</p>`:''}</div></div></div><p class="whisper"><span>${WHISPERS[hash(g||title)%WHISPERS.length]}</span></p>`;
}
function legend(){return `<div class="legend"><span><i class="sw" style="background:var(--gold-soft);border-color:var(--gold)"></i>Nuestra edición</span><span><i class="sw" style="background:var(--fan-soft)"></i>VEO21 no es oficial</span><span><i class="sw" style="background:var(--accent-soft)"></i>Pecado distinto entre ediciones</span><span>«(PDF)» = página del PDF escaneado; si no, página del libro.</span></div>`}
function renderView(){
  const v=$('#view');
  if(S.q){ const q=fold(S.q).trim(); const terms=q.split(/\s+/).filter(Boolean);
    const res=E.filter(e=>{const hay=fold([e.title,e.group,e.sub||'',...Object.values(e.v).map(x=>x.t+' '+(x.r||'')),...(e.h?Object.values(e.h).flat():[])].join(' '));return terms.every(t=>hay.includes(t))});
    res.sort((a,b)=>(fold(b.title).includes(q)?1:0)-(fold(a.title).includes(q)?1:0));
    v.innerHTML=headBlock(`Resultados de «${S.q}»`,`${res.length} entradas${res.length>80?' (se muestran las 80 primeras)':''}`,null)+legend()+(res.length?res.slice(0,80).map(entryHTML).join(''):'<p class="empty">Nada coincide. Prueba con una sola palabra o sin tildes.</p>');return }
  if(S.cat==='Fuentes'){ v.innerHTML=sourcesHTML(); return }
  const items=E.filter(e=>e.cat===S.cat&&e.group===S.group);
  const subs=[...new Set(items.map(e=>e.sub||''))];
  const intro={'Caminos principales':'Los cinco Caminos y su jerarquía de pecados (del 10, el más leve, al 1, el más grave).','Senderos':'Variantes de cada Camino. En EO:V 2003 solo se nombran; VEO21 les da jerarquía propia.','Caminos de clan (menores)':'Oficiales en EO:V gracias al Libro del Narrador; VEO21 añade Enjambre, Caín y Lilith.'}[S.group]||'';
  let h=headBlock(S.group,intro,S.group)+legend();
  subs.forEach(sb=>{ const list=items.filter(e=>(e.sub||'')===sb).sort((a,b)=>a.lvl-b.lvl||(a.title==='(Disciplina)'?-1:0));
    if(sb) h+=`<div class="subhead">${esc(sb)}</div>`; h+=list.map(entryHTML).join('') });
  v.innerHTML=h+finSVG;
}
function sourcesHTML(){
  return headBlock('Fuentes y ediciones','Los resúmenes están redactados a partir de los PDF de la carpeta RVLEO. No sustituyen al manual: para el texto completo ve a la página indicada.','Fuentes')+`<div class="eds">`+
  ED.map(ed=>`<div class="edcard">${ed.status==='cargado'?waxSVG:''}<div class="st" style="color:${ed.status==='cargado'?(ed.fan?'var(--fan)':'var(--gold)'):'var(--muted)'}">${ed.status==='cargado'?(ed.fan?'Cargado · no oficial':(ed.partial?'Solo suplementos':'Cargado')):'Manual pendiente'}</div><h5>${esc(ed.name)}</h5><div style="color:var(--muted);font-size:.88rem">${esc(ed.pub)}</div>${ed.books.length?'<ul>'+ed.books.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>':'<p style="font-size:.9rem;color:var(--muted)">Cuando añadas el PDF a la carpeta, se rellenará su columna.</p>'}</div>`).join('')+
  `</div><p style="max-width:70ch;margin-top:18px"><b>Instalar en el móvil:</b> abre esta página en el navegador y elige «Añadir a pantalla de inicio» (Safari: botón Compartir; Chrome: menú ⋮). Después funciona sin conexión.</p><p style="color:var(--muted);max-width:70ch;margin-top:12px">Las Disciplinas de nivel 1-5 de VEO21 copian el texto de EO:V 2003 y se marcan como «Mismo texto». Las diferencias reales están en los poderes de nivel 6 a 9, en las líneas de sangre, en las nuevas hechicerías, en las jerarquías propias de cada sendero y en algunas reglas de Caminos (excomunión, maestros, umbrales de iniciado, devoto y virtuoso).</p>`;
}
